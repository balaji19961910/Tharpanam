us","step.tarpanam_karunya.how":"Offer water and ellu to each deceased karunya relative, then the generic line.","step.pradakshina_namaskaram.title":"Pradakshina namaskaram","step.pradakshina_namaskaram.how":"Circumambulate and prostrate to the devas and pitrus.","step.upasthanam.title":"Upasthanam","step.upasthanam.how":"Offer reverence to the pitrus once more.","step.abhivadaye.title":"Abhivadaye","step.abhivadaye.how":"Announce your gotra and pravara and prostrate.","step.udvasanam.title":"Udvasanam","step.udvasanam.how":"Ask the invoked pitrus to return to their abode; untie each koorcham.","step.sarva_tarpanam.title":"Sarva tarpanam","step.sarva_tarpanam.how":"Holding all koorchams and the remaining ellu, offer a single, final pour for all souls.","step.pavitram_visarjanam.title":"Pavitram visarjanam","step.pavitram_visarjanam.how":"Untie the pavitram; place it on the ear or drop it to the north-west.","step.achamanam_2.title":"Achamanam","step.achamanam_2.how":"Repeat achamanam as at step 1.","step.samarpanam.title":"Samarpanam","step.samarpanam.how":"Dedicate the ritual performed by body, speech and mind.","step.dakshina.title":"Dakshina","step.dakshina.how":"Optional: offer dakshina to the officiating acharya.","step.after_notes.title":"After the tharpanam","step.after_notes.how":"Brahma yajnam and daily pooja may follow. A light evening meal is customary on this day.","chip.facing.east":"Face east","chip.facing.south":"Face south","chip.theertham.brahma":"Brahma theertham (sip from the base of the palm)","chip.theertham.pitru":"Pitru theertham (pour between thumb and index finger)","chip.pavitram":"Pavitram on","step.do_title":"What to do","step.mantra_title":"Say","step.materials.do":`Bathe first and wear a panchakacham dhoti and angavastram. Do not eat until the tharpanam is over.
Make the pavitram (a ring of 2\u20133 darbha blades) and the koorchams (darbha tied in a knot, tips forming a loop) beforehand, or keep them ready.
Sit on a low seat with the plate in front of you, the chombu of water and a cup of ellu on your right.
Keep a panchapatram with water and the uddharani for achamanam.`,"step.achamanam_1.do":`Sit facing east, poonal in the normal position (left shoulder).
Hold the right palm cupped like a cow's ear (gokarna): index finger folded in, thumb and little finger held apart.
Take with the uddharani only as much water as wets the throat, and sip it from the base of the palm three times, saying Acyut\u0101ya, Anant\u0101ya, Govind\u0101ya nama\u1E25.
Ke\u015Bava, N\u0101r\u0101ya\u1E47a: touch the right cheek, then the left cheek, with the right thumb.
M\u0101dhava, Govinda: touch the right eye, then the left eye, with the ring finger.
Vi\u1E63\u1E47u, Madhus\u016Bdana: touch the right nostril, then the left, with the index finger.
Trivikrama, V\u0101mana: touch the right ear, then the left, with the little finger.
\u015Ar\u012Bdhara, H\u1E5B\u1E63\u012Bke\u015Ba: touch the right shoulder, then the left, with the middle finger.
Padman\u0101bha: touch the navel with all fingers. D\u0101modara: touch the crown of the head with all fingers.`,"step.pavitram_dharanam.do":`Wash the hands.
Wear the pavitram on the right ring finger while reciting the mantra.
Put the kattai darbha under your feet.
Touch water and wash the hand, then hold a few kattai darbha folded together with the pavitram.`,"step.ganapati_dhyanam.do":`Make loose fists with both hands.
Gently tap your temples with the knuckles (about five times) while reciting.
Then join the palms briefly in namaskaram.`,"step.pranayamam.do":`Sit upright and rest the left hand on your lap.
Right hand: fold the index and middle fingers into the palm. The thumb closes the right nostril; the ring and little fingers close the left nostril.
Breathe in through the left nostril (thumb closing the right).
Close both nostrils and recite the whole mantra softly or mentally while holding the breath.
Breathe out slowly through the right nostril (ring and little fingers closing the left).
At the end, touch the right ear with the right fingers. Many families do this three times.`,"step.sankalpam_deva_part.do":`Place the right palm over the left palm and rest both on the right thigh, holding the darbha.
Recite the time and place clearly. Keep the hands in the same position; the sankalpam continues in the next step.`,"step.sankalpam_pitru_part.do":`Change the poonal to the right shoulder (pracheenaveeti).
Keep the palms together on the right thigh, as before.
Recite the gotras and names slowly. This is the part that must be exact.
At \u201Ckari\u1E63ye\u201D, touch water (or let a little water with ellu fall onto the plate), as your family does.`,"step.darbha_nirasanam.do":`Drop only the kattai darbha held with the pavitram (keep the pavitram on).
Change the poonal to the normal position, touch water and wipe the hand.
Then change the poonal back to the right shoulder.`,"step.koorcha_sthapanam.do":`Change the poonal to the right shoulder.
Place the koorcham(s) in the middle of the plate with the tip pointing south.
With the hand turned over, put a little ellu on the tip of each koorcham while reciting the avahana mantra.`,"step.avahanam_pitru.do":`Take a pinch of ellu between the thumb, middle and ring fingers of the right hand.
Recite the mantra looking at the first koorcham, thinking of each ancestor as their name is said.
At \u201C\u0101v\u0101hay\u0101mi\u201D, place the ellu on the first koorcham.`,"step.avahanam_matamaha.do":`Take a fresh pinch of ellu.
Recite looking at the second koorcham (mother's side).
At \u201C\u0101v\u0101hay\u0101mi\u201D, place the ellu on it.`,"step.avahanam_karunya.do":`Take a fresh pinch of ellu.
Recite looking at the karunya koorcham.
At \u201C\u0101v\u0101hay\u0101mi\u201D, place the ellu on it.`,"step.asanam.do":"Place a few darbha blades on each koorcham as a seat for the invoked pitrus while reciting.","step.aradhanam.do":`Sprinkle ellu over all the koorchams while reciting.
This stands for all the offerings (flowers, sandal, etc.) of a full shraddham.`,"step.tarpanam_pitru.do":`Hold the chombu in the left hand. Put a pinch of ellu in the right palm.
Tilt the right hand so the water runs off between the thumb and index finger (pitru theertham).
Say one line. At \u201Ctarpay\u0101mi\u201D, pour water with ellu onto the first koorcham.
Repeat each line the number of times shown (tap the counter). Add ellu whenever the palm is empty.`,"step.tarpanam_matamaha.do":`Same method as the pitru varga: chombu in the left hand, ellu in the right palm.
Pour through pitru theertham onto the second koorcham at each \u201Ctarpay\u0101mi\u201D.
Repeat each line the number of times shown.`,"step.tarpanam_karunya.do":`Same method: ellu in the right palm, water poured between thumb and index finger.
Pour onto the karunya koorcham, once per repetition shown.`,"step.pradakshina_namaskaram.do":`Change the poonal to the normal position.
Stand and turn clockwise in place three times while reciting.
Then prostrate (namaskaram).`,"step.upasthanam.do":`Change the poonal to the right shoulder.
Stand facing the koorchams with folded hands and recite.`,"step.abhivadaye.do":`Change the poonal to the normal position.
Stand. Touch the right ear with the right hand and the left ear with the left hand.
Recite the abhivadaye clearly.
Then prostrate (namaskaram).`,"step.udvasanam.do":`Change the poonal to the right shoulder.
Looking at the koorcham, recite the yath\u0101sth\u0101nam line.`,"step.sarva_tarpanam.do":`Take the koorcham from the plate and untie it.
Hold it between the right thumb and index finger.
Recite the mantra and pour water over it.`,"step.pavitram_visarjanam.do":`Change the poonal to the normal position.
Untie the pavitram (do not pull it off the finger).
Place it on the right ear, or drop it to the north-west.`,"step.achamanam_2.do":"Do achamanam exactly as at the start: three sips with Acyut\u0101ya, Anant\u0101ya, Govind\u0101ya nama\u1E25, then the Ke\u015Bava touches.","step.samarpanam.do":`Take a little water in the right palm.
Recite, and let the water fall onto the plate, offering the whole ritual to the Lord.`,"step.dakshina.do":"If an acharya officiated, offer betel leaves, fruit and dakshina with a tulasi leaf, and prostrate.","step.after_notes.do":`Pour the water from the plate at the foot of a tree or plant, not into a drain.
Brahma yajnam and daily pooja may follow.
Eat only after the tharpanam. At night, the kartha and spouse usually have a light meal (tiffin, fruit or milk).`,"preset.tamilSheet":"Tamil vadhyar sheet (women not named)","preset.devanagariBooklet":"Devanagari booklet (women named)","preset.teluguIyer":"Telugu Iyer (asmat \u2026 ammad\u0101)","preset.dailySheet":"Daily sheet (kany\u0101 (bh\u0101drapada), tadupari, day count)","profile.wording.title":"Wording (as your vadhyar says it)","profile.wording.hint":"Vadhyars word the sankalpam and tharpanam differently. Start from a preset that looks like your sheet, then adjust. The preview below updates as you change things.","profile.wording.presets":"Presets","profile.wording.custom":"Custom\u2026","profile.wording.sankalpam":"Sankalpam","profile.wording.sankalpaStyle.gotraFirst":"Gotra first, women named","profile.wording.sankalpaStyle.gotraFirstUnnamed":"Gotra first, women not named","profile.wording.sankalpaStyle.relationFirst":"Relation first (asmat pit\u1E5B\u2026 gotr\u0101\u1E47\u0101\u1E43)","profile.wording.sapatnika":"Say the mother's side as \u201Csapatn\u012Bka m\u0101t\u0101maha\u2026\u201D (her mother's line is not said separately)","profile.wording.yogaKarana":"Yoga & karana","profile.wording.yk.actual":"Actual names (dhruva n\u0101ma yoga \u2026)","profile.wording.yk.vishnu":"vi\u1E63\u1E47u yoga vi\u1E63\u1E47u kara\u1E47a","profile.wording.yk.vishnuActual":"vi\u1E63\u1E47u yoga vi\u1E63\u1E47u kara\u1E47a (with actual names)","profile.wording.changeStyle":"When a star/yoga/karana changes during the day","profile.wording.change.atTime":"Say the one at the chosen time","profile.wording.change.tadupari":"Say both: \u201CX tadupari Y\u201D","profile.wording.names":"Words after names","profile.wording.masc":"After men's names","profile.wording.karunya":"Karunya pitru lines","profile.wording.karunya.singular":"Singular: \u2026 gotram \u2026 \u015Barm\u0101\u1E47am vasu r\u016Bpam m\u0101tulam","profile.wording.karunya.same":"Same style as the main lines","profile.wording.koorcham":"Koorchams","profile.wording.koorcham.separate":"Separate: 2 on Amavasya, 3 on Mahalaya","profile.wording.koorcham.single":"One koorcham for everyone","profile.settings.masa.both":"Both: kany\u0101 (bh\u0101drapada)","mahalaya.title":"Mahalaya paksha","mahalaya.purpose":"How the sankalpam ends","mahalaya.purpose.hiranya":"\u2026 \u015Br\u0101ddha\u1E43 hira\u1E47ya r\u016Bpe\u1E47a, tada\u1E45ga\u1E43 tila tarpa\u1E47a\u1E43","mahalaya.purpose.tarpana":"\u2026 \u015Br\u0101ddha praty\u0101mn\u0101ya\u1E43 tila tarpa\u1E47a\u1E43 (tharpanam only)","mahalaya.purpose.dayCount":"adya dina (prathama dina) prayukta pak\u1E63\u012Bya \u2026 (day number)","mahalaya.purpose.madhye":"pak\u1E63a mah\u0101laye\u1E63u madhye adya dina prayukta \u2026","mahalaya.kind":"Which days you do it","mahalaya.kind.daily":"Every day of the paksha","mahalaya.kind.punya":"On special (pu\u1E47ya) days","mahalaya.kind.sakrt":"Only one day (sak\u1E5Bt)","mahalaya.planner":"Days of this Mahalaya paksha","mahalaya.planner_hint":"Tithi at sunrise (\u2192 the next one if it starts before the next sunrise). Special days are judged at mid-afternoon (apar\u0101hna). Tap a day to use it.","mahalaya.special":"Special","special.mahabharani":"Mah\u0101bhara\u1E47\u012B","special.mahavyatipata":"Mah\u0101vyat\u012Bp\u0101ta","special.madhyashtami":"Madhy\u0101\u1E63\u1E6Dam\u012B","special.avidhava_navami":"Avidhav\u0101 navam\u012B","special.sannyasta":"Sannyasta mah\u0101layam","special.dvapara_yugadi":"Dv\u0101para yug\u0101di","special.gajacchaya":"Gajacch\u0101y\u0101","special.shastrahata":"\u015Aastrahata caturda\u015B\u012B","special.mahalaya_amavasya":"Mah\u0101laya am\u0101v\u0101sy\u0101","special.purti":"Mah\u0101laya p\u016Brti","step.urjam.title":"\u016Arja\u1E43 vahant\u012B\u1E25","step.urjam.how":"A final pour of water for all the pitrus after the tharpanam.","step.urjam.do":"With ellu and water in the right hand, recite and pour once over the koorcham(s) through pitru theertham.","step.add_line":"Add a line","step.add_step":"Add a step after this","step.remove_step":"Remove this step","step.custom.title":"My vadhyar's addition","profile.person.omit":"Don't say","profile.person.omitted":"Not said","profile.lineage.only_mgm":"Say only my maternal grandmother","profile.lineage.say_all":"Say everyone","profile.lineage.jnatajnata":"Also say the j\xF1\u0101t\u0101j\xF1\u0101ta (known & unknown) lines for this side","profile.settings.brahmaYajnam":"Include Brahma yajnam after the tharpanam (Yajur / \u0100pastamba)","relation.pet":"Pet (named animal)","karunya.species":"Animal","karunya.species.dog":"Dog","karunya.species.cat":"Cat","karunya.species.cow":"Cow","karunya.species.bird":"Bird","karunya.species.other":"Other","step.hiranya_visvedeva.title":"Hira\u1E47ya \u2014 vi\u015Bvedevas","step.hiranya_visvedeva.how":"Give dakshina (in place of the shraddha meal) for the vi\u015Bvedevas.","step.hiranya_visvedeva.do":`Poonal in the normal position.
Hold the dakshina (money / rice & raw banana) with a tulasi leaf.
Recite, and at \u201Csampradade\u201D place it in front of the vadhyar (or keep it aside for a brahmin).`,"step.hiranya_pitru.title":"Hira\u1E47ya \u2014 pitrus","step.hiranya_pitru.how":"Give dakshina for the pitrus of both lines and the karunya pitrus.","step.hiranya_pitru.do":`Change the poonal to the right shoulder.
Hold the dakshina with a tulasi leaf, recite, and give it at \u201Csampradade\u201D.`,"step.hiranya_vishnu.title":"Hira\u1E47ya \u2014 Mah\u0101vi\u1E63\u1E47u","step.hiranya_vishnu.how":"Give dakshina for Mah\u0101vi\u1E63\u1E47u, the protector of the Mahalaya shraddham.","step.hiranya_vishnu.do":`Poonal in the normal position.
Hold the dakshina with a tulasi leaf, recite, and give it; then namaskaram with \u201Cdevat\u0101bhya\u1E25\u2026\u201D.`,"step.hiranya_anugraha.title":"Hira\u1E47ya \u2014 asking for blessing","step.hiranya_anugraha.how":"Ask that the pitrus be satisfied by this shraddham.","step.hiranya_anugraha.do":"Change the poonal to the right shoulder, recite with folded hands, then go on to the tharpanam.","step.by_sankalpam.title":"Brahma yajnam \u2014 sankalpam","step.by_sankalpam.how":"Resolve to do the Brahma yajnam.","step.by_sankalpam.do":`Achamanam, \u015Bukl\u0101mbaradharam, pranayamam.
Recite the sankalpam.`,"step.by_vidyut.title":"Vidyud asi","step.by_vidyut.how":"Purify before the japa.","step.by_vidyut.do":`Recite, then wash both hands.
Do achamanam three times; wipe the lips twice with the thumb and once with three fingers; wash the hand.
Touch the head, both eyes, both nostrils, both ears and the heart.
Take water in the right hand and sprinkle the left hand and the feet.`,"step.by_japa.title":"Brahma yajnam \u2014 japa","step.by_japa.how":"Recite the Veda openings in the Brahma yajnam posture.","step.by_japa.do":`Sit with the right foot on the left knee.
Left hand palm up on the right knee, fingers pointing east; place the darbha and pavitram in it.
Right hand palm down over it, fingers pointing east.
Look towards where the earth meets the sky and recite with a calm mind.
Say the \u201Cnamo brahma\u1E47e\u2026\u201D line three times. Wash the hands at the end.`,"step.by_deva.title":"Deva tharpanam","step.by_deva.how":"Offer water to the devas, once each.","step.by_deva.do":`Poonal in the normal position (upav\u012Bt\u012B).
Pour water once for each line from the fingertips (deva theertham).`,"step.by_rishi.title":"Rishi tharpanam","step.by_rishi.how":"Offer water to the rishis.","step.by_rishi.do":`Wear the poonal like a garland (niv\u012Bt\u012B).
Pour twice for each line from the little-finger side of the palm (rishi theertham), unless the heading line says otherwise.
The counters show how many times for each line.`,"step.by_pitru.title":"Pitru tharpanam (Brahma yajnam)","step.by_pitru.how":"Offer water to all pitrus, three times each.","step.by_pitru.do":`Change the poonal to the right shoulder (pr\u0101c\u012Bn\u0101v\u012Bt\u012B).
Pour three times for each line between the thumb and index finger (pitru theertham).
Those whose father is living wear the poonal so that it does not pass the left wrist.`,"step.by_close.title":"Brahma yajnam \u2014 samarpanam","step.by_close.how":"Finish the Brahma yajnam.","step.by_close.do":`Poonal in the normal position.
Do achamanam twice, recite the samarpanam, then achamanam again.`,"chip.theertham.deva":"Deva theertham (from the fingertips)","chip.theertham.rishi":"Rishi theertham (little-finger side)","chip.facing.north":"Face north","tab.day":"Day","profile.lineage.matamaha_gotra":"Mother's side gotra (your mother's birth gotra)","profile.lineage.matamaha_gotra_hint":"Said for your maternal grandfather, grandmother and their elders, and for maternal relatives in the karunya list.","profile.lineage.matamaha_gotra_empty":`Not set: the placeholder "tat tat" gotra will be said. Pick your mother's birth gotra (her father's gotra).`,"print.paper":"Paper","print.size":"Text size","print.size.s":"Small","print.size.m":"Medium","print.size.l":"Large","print.opt.howTo":'Include "what to do" instructions',"print.opt.materials":"Include materials list","print.opt.boxes":"Tick boxes for each offering","print.opt.abhivadaye":"Include abhivadaye","print.samvatsara":"Samvatsara","print.masa":"Masa","print.paksha":"Paksha","print.tithi":"Tithi","print.vasara":"Vasara","print.nakshatra":"Nakshatra","print.kartha":"Performer","print.gotra":"Gotra","print.footer":"Prepared with Tharpanam Helper. Please check the wording with your family vadhyar.","print.density":"Layout","print.density.compact":"Compact","print.density.comfortable":"Spacious","profile.settings.achamanam":"Achamanam","profile.settings.achamanam.keshava24":"24 names: Ke\u015Bava, N\u0101r\u0101ya\u1E47a, M\u0101dhava (sips) \u2026 \u015Ar\u012B K\u1E5B\u1E63\u1E47a","profile.settings.achamanam.achyuta":"Acyuta, Ananta, Govinda (sips) + 12 Ke\u015Bava touches","step.achamanam_1.do24":`Sit facing east, poonal in the normal position (left shoulder).
Hold the right palm cupped like a cow's ear (gokarna) and take only as much water as wets the throat. Sip it from the base of the palm three times: Ke\u015Bava, N\u0101r\u0101ya\u1E47a, M\u0101dhava.
Govinda: wash the right hand with a little water.
Vi\u1E63\u1E47u: touch the right cheek. Madhus\u016Bdana: touch the left cheek.
Trivikrama: touch the chin.
V\u0101mana: place the left hand on top of the right hand. \u015Ar\u012Bdhara: place the right hand on top of the left hand.
H\u1E5B\u1E63\u012Bke\u015Ba: touch the right knee. Padman\u0101bha: touch the left knee.
D\u0101modara: touch the top of the head.
Sa\u1E45kar\u1E63a\u1E47a: touch below the nose.
V\u0101sudeva: touch below the right eye. Pradyumna: touch below the left eye.
Aniruddha: touch the right eye. Puru\u1E63ottama: touch the left eye.
Adhok\u1E63aja: touch the right foot. Narasi\u1E43ha: touch the left foot.
Acyuta: touch the navel.
Jan\u0101rdana: touch the chest.

\u0B86\u0B9A\u0BAE\u0BA9\u0BA4\u0BCD\u0BA4\u0BBF\u0BB1\u0BCD\u0B95\u0BC1 \u0BAA\u0B9E\u0BCD\u0B9A\u0BAA\u0BBE\u0BA4\u0BCD\u0BB0\u0BA4\u0BCD\u0BA4\u0BBF\u0BB2\u0BCD \u0BA8\u0BC0\u0BB0\u0BC1\u0BAE\u0BCD \u0B89\u0BA4\u0BCD\u0BA4\u0BB0\u0BA3\u0BBF\u0BAF\u0BC1\u0BAE\u0BCD \u0BB5\u0BC8\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD.`,"step.achamanam_1.do":`\u0B95\u0BBF\u0BB4\u0B95\u0BCD\u0B95\u0BC1 \u0BA8\u0BCB\u0B95\u0BCD\u0B95\u0BBF \u0B85\u0BAE\u0BB0\u0BB5\u0BC1\u0BAE\u0BCD; \u0BAA\u0BC2\u0BA3\u0BC2\u0BB2\u0BCD \u0BB5\u0BB4\u0B95\u0BCD\u0B95\u0BAE\u0BCD \u0BAA\u0BCB\u0BB2\u0BCD (\u0B87\u0B9F\u0BA4\u0BC1 \u0BA4\u0BCB\u0BB3\u0BCD).
\u0BB5\u0BB2\u0BA4\u0BC1 \u0B89\u0BB3\u0BCD\u0BB3\u0B99\u0BCD\u0B95\u0BC8\u0BAF\u0BC8 \u0BAA\u0B9A\u0BC1\u0BB5\u0BBF\u0BA9\u0BCD \u0B95\u0BBE\u0BA4\u0BC1 \u0BAA\u0BCB\u0BB2\u0BCD (\u0B95\u0BCB\u0B95\u0BB0\u0BCD\u0BA3\u0BAE\u0BCD) \u0B95\u0BC1\u0BB4\u0BBF\u0BA4\u0BCD\u0BA4\u0BC1\u0B95\u0BCD \u0B95\u0BCA\u0BB3\u0BCD\u0BB3\u0BB5\u0BC1\u0BAE\u0BCD: \u0B86\u0BB3\u0BCD\u0B95\u0BBE\u0B9F\u0BCD\u0B9F\u0BBF \u0BB5\u0BBF\u0BB0\u0BB2\u0BCD \u0BAE\u0B9F\u0B99\u0BCD\u0B95\u0BBF, \u0B95\u0B9F\u0BCD\u0B9F\u0BC8 \u0BB5\u0BBF\u0BB0\u0BB2\u0BC1\u0BAE\u0BCD \u0B9A\u0BC1\u0BA3\u0BCD\u0B9F\u0BC1 \u0BB5\u0BBF\u0BB0\u0BB2\u0BC1\u0BAE\u0BCD \u0BB5\u0BBF\u0BB2\u0B95\u0BBF.
\u0BA4\u0BCA\u0BA3\u0BCD\u0B9F\u0BC8 \u0BA8\u0BA9\u0BC8\u0BAF\u0BC1\u0BAE\u0BCD \u0B85\u0BB3\u0BB5\u0BC1 \u0BAE\u0B9F\u0BCD\u0B9F\u0BC1\u0BAE\u0BCD \u0B89\u0BA4\u0BCD\u0BA4\u0BB0\u0BA3\u0BBF\u0BAF\u0BBE\u0BB2\u0BCD \u0BA8\u0BC0\u0BB0\u0BCD \u0B8E\u0B9F\u0BC1\u0BA4\u0BCD\u0BA4\u0BC1, \u0B89\u0BB3\u0BCD\u0BB3\u0B99\u0BCD\u0B95\u0BC8 \u0B85\u0B9F\u0BBF\u0BAF\u0BBF\u0BB2\u0BBF\u0BB0\u0BC1\u0BA8\u0BCD\u0BA4\u0BC1 \u0BAE\u0BC2\u0BA9\u0BCD\u0BB1\u0BC1 \u0BAE\u0BC1\u0BB1\u0BC8 \u0B85\u0BB0\u0BC1\u0BA8\u0BCD\u0BA4\u0BB5\u0BC1\u0BAE\u0BCD \u2014 \u0B85\u0B9A\u0BCD\u0BAF\u0BC1\u0BA4\u0BBE\u0BAF, \u0B85\u0BA9\u0BA8\u0BCD\u0BA4\u0BBE\u0BAF, \u0B95\u0BCB\u0BB5\u0BBF\u0BA8\u0BCD\u0BA4\u0BBE\u0BAF \u0BA8\u0BAE:.
\u0B95\u0BC7\u0BB6\u0BB5, \u0BA8\u0BBE\u0BB0\u0BBE\u0BAF\u0BA3: \u0BB5\u0BB2\u0BA4\u0BC1 \u0B95\u0B9F\u0BCD\u0B9F\u0BC8 \u0BB5\u0BBF\u0BB0\u0BB2\u0BBE\u0BB2\u0BCD \u0BB5\u0BB2\u0BA4\u0BC1 \u0B95\u0BA9\u0BCD\u0BA9\u0BAE\u0BCD, \u0BAA\u0BBF\u0BA9\u0BCD \u0B87\u0B9F\u0BA4\u0BC1 \u0B95\u0BA9\u0BCD\u0BA9\u0BAE\u0BCD.
\u0BAE\u0BBE\u0BA4\u0BB5, \u0B95\u0BCB\u0BB5\u0BBF\u0BA8\u0BCD\u0BA4: \u0BAE\u0BCB\u0BA4\u0BBF\u0BB0 \u0BB5\u0BBF\u0BB0\u0BB2\u0BBE\u0BB2\u0BCD \u0BB5\u0BB2\u0BA4\u0BC1 \u0B95\u0BA3\u0BCD, \u0BAA\u0BBF\u0BA9\u0BCD \u0B87\u0B9F\u0BA4\u0BC1 \u0B95\u0BA3\u0BCD.
\u0BB5\u0BBF\u0BB7\u0BCD\u0BA3\u0BC1, \u0BAE\u0BA4\u0BC1\u0BB8\u0BC2\u0BA4\u0BA9: \u0B86\u0BB3\u0BCD\u0B95\u0BBE\u0B9F\u0BCD\u0B9F\u0BBF \u0BB5\u0BBF\u0BB0\u0BB2\u0BBE\u0BB2\u0BCD \u0BB5\u0BB2\u0BA4\u0BC1 \u0BA8\u0BBE\u0B9A\u0BBF, \u0BAA\u0BBF\u0BA9\u0BCD \u0B87\u0B9F\u0BA4\u0BC1 \u0BA8\u0BBE\u0B9A\u0BBF.
\u0BA4\u0BCD\u0BB0\u0BBF\u0BB5\u0BBF\u0B95\u0BCD\u0BB0\u0BAE, \u0BB5\u0BBE\u0BAE\u0BA9: \u0B9A\u0BC1\u0BA3\u0BCD\u0B9F\u0BC1 \u0BB5\u0BBF\u0BB0\u0BB2\u0BBE\u0BB2\u0BCD \u0BB5\u0BB2\u0BA4\u0BC1 \u0B95\u0BBE\u0BA4\u0BC1, \u0BAA\u0BBF\u0BA9\u0BCD \u0B87\u0B9F\u0BA4\u0BC1 \u0B95\u0BBE\u0BA4\u0BC1.
\u0BB6\u0BCD\u0BB0\u0BC0\u0BA4\u0BB0, \u0BB9\u0BCD\u0BB0\u0BC1\u0BB7\u0BC0\u0B95\u0BC7\u0BB6: \u0BA8\u0B9F\u0BC1 \u0BB5\u0BBF\u0BB0\u0BB2\u0BBE\u0BB2\u0BCD \u0BB5\u0BB2\u0BA4\u0BC1 \u0BA4\u0BCB\u0BB3\u0BCD, \u0BAA\u0BBF\u0BA9\u0BCD \u0B87\u0B9F\u0BA4\u0BC1 \u0BA4\u0BCB\u0BB3\u0BCD.
\u0BAA\u0BA4\u0BCD\u0BAE\u0BA8\u0BBE\u0BAA: \u0B8E\u0BB2\u0BCD\u0BB2\u0BBE \u0BB5\u0BBF\u0BB0\u0BB2\u0BCD\u0B95\u0BB3\u0BBE\u0BB2\u0BC1\u0BAE\u0BCD \u0BA4\u0BCA\u0BAA\u0BCD\u0BAA\u0BC1\u0BB3\u0BCD. \u0BA4\u0BBE\u0BAE\u0BCB\u0BA4\u0BB0: \u0B8E\u0BB2\u0BCD\u0BB2\u0BBE \u0BB5\u0BBF\u0BB0\u0BB2\u0BCD\u0B95\u0BB3\u0BBE\u0BB2\u0BC1\u0BAE\u0BCD \u0B89\u0B9A\u0BCD\u0B9A\u0BA8\u0BCD\u0BA4\u0BB2\u0BC8.`,"step.pavitram_dharanam.do":`\u0B95\u0BC8\u0B95\u0BB3\u0BC8\u0B95\u0BCD \u0B95\u0BB4\u0BC1\u0BB5\u0BB5\u0BC1\u0BAE\u0BCD.
\u0BAE\u0BA8\u0BCD\u0BA4\u0BBF\u0BB0\u0BAE\u0BCD \u0B9A\u0BCA\u0BB2\u0BCD\u0BB2\u0BBF \u0BB5\u0BB2\u0BA4\u0BC1 \u0BAE\u0BCB\u0BA4\u0BBF\u0BB0 \u0BB5\u0BBF\u0BB0\u0BB2\u0BBF\u0BB2\u0BCD \u0BAA\u0BB5\u0BBF\u0BA4\u0BCD\u0BB0\u0BAE\u0BCD \u0BAA\u0BCB\u0B9F\u0BCD\u0B9F\u0BC1\u0B95\u0BCD \u0B95\u0BCA\u0BB3\u0BCD\u0BB3\u0BB5\u0BC1\u0BAE\u0BCD.
\u0B95\u0B9F\u0BCD\u0B9F\u0BC8 \u0BA4\u0BB0\u0BCD\u0BAA\u0BCD\u0BAA\u0BC8\u0B95\u0BB3\u0BC8 \u0B95\u0BBE\u0BB2\u0BC1\u0B95\u0BCD\u0B95\u0BC1 \u0B85\u0B9F\u0BBF\u0BAF\u0BBF\u0BB2\u0BCD \u0BAA\u0BCB\u0B9F\u0BCD\u0B9F\u0BC1\u0B95\u0BCD \u0B95\u0BCA\u0BB3\u0BCD\u0BB3\u0BB5\u0BC1\u0BAE\u0BCD.
\u0B95\u0BC8\u0BAF\u0BC8 \u0B9C\u0BB2\u0BAE\u0BCD \u0BA4\u0BCA\u0B9F\u0BCD\u0B9F\u0BC1 \u0B85\u0BB2\u0BAE\u0BCD\u0BAA\u0BBF, \u0B9A\u0BBF\u0BB2 \u0B95\u0B9F\u0BCD\u0B9F\u0BC8 \u0BA4\u0BB0\u0BCD\u0BAA\u0BCD\u0BAA\u0BC8\u0B95\u0BB3\u0BC8 \u0BAA\u0BB5\u0BBF\u0BA4\u0BCD\u0BB0\u0BA4\u0BCD\u0BA4\u0BC1\u0B9F\u0BA9\u0BCD \u0BAE\u0B9F\u0BBF\u0BA4\u0BCD\u0BA4\u0BC1 \u0BB5\u0BC8\u0BA4\u0BCD\u0BA4\u0BC1\u0B95\u0BCD \u0B95\u0BCA\u0BB3\u0BCD\u0BB3\u0BB5\u0BC1\u0BAE\u0BCD.`,"step.ganapati_dhyanam.do":`\u0B87\u0BB0\u0BC1 \u0B95\u0BC8\u0B95\u0BB3\u0BC8\u0BAF\u0BC1\u0BAE\u0BCD \u0BA4\u0BB3\u0BB0\u0BCD\u0BB5\u0BBE\u0B95 \u0BAE\u0BC1\u0BB7\u0BCD\u0B9F\u0BBF\u0BAF\u0BBE\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD.
\u0B9A\u0BCA\u0BB2\u0BCD\u0BB2\u0BC1\u0BAE\u0BCD \u0BAA\u0BCB\u0BA4\u0BC1 \u0BB5\u0BBF\u0BB0\u0BB2\u0BCD \u0BAE\u0BC1\u0B9F\u0BCD\u0B9F\u0BBF\u0B95\u0BB3\u0BBE\u0BB2\u0BCD \u0BA8\u0BC6\u0BB1\u0BCD\u0BB1\u0BBF\u0BAA\u0BCD \u0BAA\u0BCA\u0B9F\u0BCD\u0B9F\u0BC1\u0B95\u0BB3\u0BBF\u0BB2\u0BCD \u0BAE\u0BC6\u0BA4\u0BC1\u0BB5\u0BBE\u0B95 (\u0B9A\u0BC1\u0BAE\u0BBE\u0BB0\u0BCD \u0B90\u0BA8\u0BCD\u0BA4\u0BC1 \u0BAE\u0BC1\u0BB1\u0BC8) \u0B95\u0BC1\u0B9F\u0BCD\u0B9F\u0BBF\u0B95\u0BCD \u0B95\u0BCA\u0BB3\u0BCD\u0BB3\u0BB5\u0BC1\u0BAE\u0BCD.
\u0BAA\u0BBF\u0BA9\u0BCD \u0B95\u0BC8\u0B95\u0BC2\u0BAA\u0BCD\u0BAA\u0BBF \u0BA8\u0BAE\u0BB8\u0BCD\u0B95\u0BB0\u0BBF\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD.`,"step.pranayamam.do":`\u0BA8\u0BC7\u0BB0\u0BBE\u0B95 \u0B85\u0BAE\u0BB0\u0BCD\u0BA8\u0BCD\u0BA4\u0BC1 \u0B87\u0B9F\u0BA4\u0BC1 \u0B95\u0BC8\u0BAF\u0BC8 \u0BAE\u0B9F\u0BBF\u0BAF\u0BBF\u0BB2\u0BCD \u0BB5\u0BC8\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD.
\u0BB5\u0BB2\u0BA4\u0BC1 \u0B95\u0BC8: \u0B86\u0BB3\u0BCD\u0B95\u0BBE\u0B9F\u0BCD\u0B9F\u0BBF, \u0BA8\u0B9F\u0BC1 \u0BB5\u0BBF\u0BB0\u0BB2\u0BCD\u0B95\u0BB3\u0BC8 \u0B89\u0BB3\u0BCD\u0BB3\u0B99\u0BCD\u0B95\u0BC8\u0BAF\u0BBF\u0BB2\u0BCD \u0BAE\u0B9F\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD. \u0B95\u0B9F\u0BCD\u0B9F\u0BC8 \u0BB5\u0BBF\u0BB0\u0BB2\u0BCD \u0BB5\u0BB2\u0BA4\u0BC1 \u0BA8\u0BBE\u0B9A\u0BBF\u0BAF\u0BC8 \u0BAE\u0BC2\u0B9F\u0BC1\u0BAE\u0BCD; \u0BAE\u0BCB\u0BA4\u0BBF\u0BB0, \u0B9A\u0BC1\u0BA3\u0BCD\u0B9F\u0BC1 \u0BB5\u0BBF\u0BB0\u0BB2\u0BCD\u0B95\u0BB3\u0BCD \u0B87\u0B9F\u0BA4\u0BC1 \u0BA8\u0BBE\u0B9A\u0BBF\u0BAF\u0BC8 \u0BAE\u0BC2\u0B9F\u0BC1\u0BAE\u0BCD.
\u0B87\u0B9F\u0BA4\u0BC1 \u0BA8\u0BBE\u0B9A\u0BBF \u0BB5\u0BB4\u0BBF\u0BAF\u0BBE\u0B95 \u0BAE\u0BC2\u0B9A\u0BCD\u0B9A\u0BC8 \u0B89\u0BB3\u0BCD\u0BB3\u0BBF\u0BB4\u0BC1\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD (\u0B95\u0B9F\u0BCD\u0B9F\u0BC8 \u0BB5\u0BBF\u0BB0\u0BB2\u0BCD \u0BB5\u0BB2\u0BA4\u0BC8 \u0BAE\u0BC2\u0B9F\u0BBF).
