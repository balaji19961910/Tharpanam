        p.kartha.pravaraOverride = list;
      });
    });
    on("[data-remove-rishi]", "click", function (el) {
      T.store.updateProfile(function (p) {
        var list = currentRishis(p);
        list.splice(parseInt(el.getAttribute("data-remove-rishi"), 10), 1);
        p.kartha.pravaraOverride = list;
      });
    });
    on("#btn-add-rishi", "click", function () {
      T.store.updateProfile(function (p) {
        var list = currentRishis(p);
        list.push("");
        p.kartha.pravaraOverride = list;
      });
      var inputs = container.ownerDocument.querySelectorAll("[data-rishi]");
      if (inputs.length) inputs[inputs.length - 1].focus();
    });
    on("#btn-reset-pravara", "click", function () {
      T.store.updateProfile(function (p) { p.kartha.pravaraOverride = null; });
    });

    on("[data-mgotra]", "change", function (el) {
      T.store.updateProfile(function (p) {
        p.people = p.people || {};
        var m = p.people.mother = p.people.mother || { name: "", alive: false };
        if (el.getAttribute("data-mgotra") === "text") { m.birthGotra = el.value.trim(); m._gotraOther = true; return; }
        m._gotraOther = el.value === OTHER;
        m.birthGotra = el.value === OTHER ? "" : el.value;
      });
    });

    on("details.older-gens", "toggle", function (el) {
      openedByUser[el.getAttribute("data-chain")] = el.open;
    });

    container.querySelectorAll(".person-card").forEach(function (card) {
      var key = card.getAttribute("data-person");
      card.querySelectorAll("[data-field]").forEach(function (el) {
        el.addEventListener("change", function () {
          T.store.updateProfile(function (p) {
            p.people = p.people || {};
            p.people[key] = p.people[key] || {};
            var person = p.people[key];
            var field = el.getAttribute("data-field");
            if (field === "birthGotra") {
              person._gotraOther = el.value === OTHER;
              person.birthGotra = el.value === OTHER ? "" : el.value;
            } else if (field === "birthGotraText") {
              person.birthGotra = el.value.trim();
            } else {
              person[field] = el.type === "checkbox" ? el.checked : el.value;
            }
          });
        });
      });
    });

    on("#btn-load-sample", "click", function () {
      T.store.setProfile(JSON.parse(JSON.stringify(T.data.sampleProfile)));
    });
    on("#btn-export", "click", function () { T.store.downloadProfile(); });
    on("#btn-clear", "click", function () {
      if (window.confirm(T.ui.t("action.clear_saved_confirm"))) T.store.clearAll();
    });
    on("#input-import", "change", function (el) {
      var file = el.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try { T.store.importProfileJSON(reader.result); }
        catch (e) { window.alert(T.ui.t("action.import_failed")); }
      };
      reader.readAsText(file);
    });
  }
})(window.Thar);

/* ---- js/ui/form-occasion.js ---- */
/* js/ui/form-occasion.js — Occasion, date/time & panchang section (spec §9.2 #2, §4.2).
   Panchang values are auto-calculated from the date/time + location (js/panchang/astro.js);
   editing any field switches to manual until "Recalculate". */
window.Thar = window.Thar || {};
(function (T) {
  T.ui = T.ui || {};

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  T.ui.toLocalInput = function (d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  };
  function fmtTime(d) {
    if (!d) return "—";
    return d.toLocaleString(T.i18n.lang === "ta" ? "ta-IN" : "en-IN", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }

  // The moment the panchang is calculated for.
  T.ui.currentMoment = function () {
    var ui = T.store.get().ui;
    if (ui.useNow !== false || !ui.datetime) return new Date();
    return new Date(ui.datetime);
  };

  // Recalculate panchang fields into ui.panchang (auto mode only). Returns the compute result.
  T.ui.recomputePanchang = function (patch) {
    var s = T.store.get();
    var ui = Object.assign({}, s.ui, patch || {});
    var moment = ui.useNow !== false || !ui.datetime ? new Date() : new Date(ui.datetime);
    var loc = T.data.getLocation(ui.locationKey);
    var res = T.panchang.compute(moment, loc);
    var masaSystem = (s.profile.settings || {}).masaSystem || "solar";
    var next = Object.assign({}, patch || {}, {
      datetime: T.ui.toLocalInput(moment),
      date: T.ui.toLocalInput(moment).slice(0, 10)
    });
    if (ui.panchangAuto !== false) {
      var r = res.raw;
      next.panchang = {
        samvatsara: r.samvatsara, masa: masaSystem === "lunar" ? r.masaLunar : r.masaSolar,
        ayana: r.ayana, ritu: r.ritu, paksha: r.paksha, tithi: r.tithi, vasara: r.vasara,
        nakshatra: r.nakshatra, yoga: r.yoga, karana: r.karana,
        masaLunar: r.masaLunar, tithiNumber: res.tithiNumber,
        // sunrise value + the next one if it changes before the next sunrise ("X tadupari Y")
        day: {
          nakshatra: [res.day.nakshatra.at, res.day.nakshatra.next],
          yoga: [res.day.yoga.at, res.day.yoga.next],
          karana: [res.day.karana.at, res.day.karana.next]
        }
      };
    }
    T.store.setUI(next);
    return res;
  };

  function opts(list, selected, valueFn, labelFn) {
    return list.map(function (item) {
      var v = valueFn(item), l = labelFn(item);
      return '<option value="' + T.ui.esc(v) + '"' + (v === selected ? " selected" : "") + ">" + T.ui.esc(l) + "</option>";
    }).join("");
  }

  // Does the tithi fit the chosen occasion? Returns an i18n key for a warning, or null.
  function occasionMismatch(occasion, raw) {
    if (!raw.tithi) return null;
    if (occasion === "amavasya" || occasion === "mahalaya_amavasya") {
      return raw.tithi === "amavasya" ? null : "occasionForm.mismatch.amavasya";
    }
    if (occasion === "mahalaya") {
      return raw.paksha === "krishna" ? null : "occasionForm.mismatch.mahalaya";
    }
    return null;
  }

  // Mahalaya: purpose wording + the day planner (special days from the vadhyar sheets).
  function mahalayaCard(s, loc) {
    var st = s.profile.settings || {};
    var purpose = st.mahalayaPurpose || "hiranya";
    var days = T.panchang.mahalayaPaksha(T.ui.currentMoment(), loc);
    var selected = (s.ui.datetime || "").slice(0, 10);
    var rows = days.map(function (d) {
      var i = d.info;
      var key = T.ui.toLocalInput(d.date).slice(0, 10);
      var tithi = function (k) { var t = T.data.getTithi(k); return t ? t.label : k; };
      return '<tr class="' + (key === selected ? "current" : "") + '" data-pick-date="' + key + '">' +
        "<td>" + d.day + "</td>" +
        "<td>" + T.ui.esc(d.date.toLocaleDateString(T.i18n.lang === "ta" ? "ta-IN" : "en-IN", { weekday: "short", day: "numeric", month: "short" })) + "</td>" +
        "<td>" + T.ui.esc(tithi(i.tithi.at) + (i.tithi.next ? " → " + tithi(i.tithi.next) : "")) + "</td>" +
        "<td>" + d.tags.map(function (tg) { return '<span class="chip-badge">' + T.ui.esc(T.ui.t("special." + tg)) + "</span>"; }).join(" ") + "</td></tr>";
    }).join("");
    return (
      '<div class="card"><h2>' + T.ui.t("mahalaya.title") + "</h2>" +
      '<div class="field-row">' +
      '<div class="field"><label>' + T.ui.t("mahalaya.purpose") + '</label><select data-st="mahalayaPurpose">' +
      opts(T.data.mahalayaPurposes, purpose, function (x) { return x; }, function (x) { return T.ui.t("mahalaya.purpose." + x); }) + "</select></div>" +
      (purpose === "hiranya" || purpose === "tarpana"
        ? '<div class="field"><label>' + T.ui.t("mahalaya.kind") + '</label><select data-st="mahalayaKind">' +
          opts(T.data.mahalayaKinds, st.mahalayaKind || "sakrt", function (x) { return x; }, function (x) { return T.ui.t("mahalaya.kind." + x); }) + "</select></div>"
        : "") +
      "</div>" +
      '<h3>' + T.ui.t("mahalaya.planner") + "</h3>" +
      '<p class="hint">' + T.ui.t("mahalaya.planner_hint") + "</p>" +
      '<div class="table-wrap"><table class="planner"><thead><tr><th>#</th><th>' + T.ui.t("occasionForm.date") + "</th><th>" +
      T.ui.t("occasionForm.tithi") + "</th><th>" + T.ui.t("mahalaya.special") + "</th></tr></thead><tbody>" + rows + "</tbody></table></div>" +
      "</div>"
    );
  }

  T.ui.renderOccasion = function (container) {
    var s = T.store.get();
    var ui = s.ui;
    var raw = ui.panchang || {};
    var auto = ui.panchangAuto !== false;
    var useNow = ui.useNow !== false;
    var masaSystem = (s.profile.settings || {}).masaSystem || "solar";
    var loc = T.data.getLocation(ui.locationKey);
    var computed = T.panchang.compute(T.ui.currentMoment(), loc);
    var tithiLabel = function (t) { return t.label; };
    var masaOptions = masaSystem === "lunar"
      ? opts(T.data.lunarMasas, raw.masa, function (m) { return m; }, function (m) { return m; })
      : opts(T.data.solarMasas, raw.masa, function (m) { return m.key; }, function (m) { return m.label + " (" + m.tamil + ")"; });
    var mismatch = occasionMismatch(ui.occasion, raw);
    var dis = auto ? " data-auto" : "";

    container.innerHTML =
      '<div class="card"><h2>' + T.ui.t("occasionForm.title") + "</h2>" +
      '<div class="field"><label>' + T.ui.t("topbar.occasion") + '</label><div class="seg" role="radiogroup">' +
      ["amavasya", "mahalaya", "mahalaya_amavasya"].map(function (k) {
        return '<button type="button" class="seg-btn' + (ui.occasion === k ? " active" : "") + '" data-occasion="' + k + '" aria-pressed="' + (ui.occasion === k) + '">' + T.ui.esc(T.ui.t("occasion." + k)) + "</button>";
      }).join("") + "</div></div>" +

      '<div class="field-row">' +
      '<div class="field"><label>' + T.ui.t("occasionForm.datetime") + '</label>' +
      '<input type="datetime-local" id="occ-datetime" value="' + T.ui.esc(ui.datetime || T.ui.toLocalInput(new Date())) + '"' + (useNow ? " disabled" : "") + ">" +
      '<label class="check"><input type="checkbox" id="occ-usenow"' + (useNow ? " checked" : "") + "> " + T.ui.t("occasionForm.use_now") + "</label></div>" +
      '<div class="field"><label>' + T.ui.t("occasionForm.location") + '</label><select id="occ-location">' +
      opts(T.data.locations, loc.key, function (l) { return l.key; }, function (l) { return l.label; }) + "</select>" +
      '<p class="hint">' + T.ui.t("occasionForm.sunrise", { time: fmtTime(computed.sunrise) }) + "</p></div>" +
      "</div>" +

      '<div class="panchang-summary">' +
      '<div><span class="k">' + T.ui.t("occasionForm.tithi") + '</span><span class="v">' +
      T.ui.esc((T.data.paksha.filter(function (p) { return p.key === computed.raw.paksha; })[0] || {}).loc + " " +
        (T.data.getTithi(computed.raw.tithi) || {}).label) + "</span>" +
      '<span class="hint">' + T.ui.t("occasionForm.ends", { time: fmtTime(computed.tithiEnds) }) + "</span></div>" +
      '<div><span class="k">' + T.ui.t("occasionForm.nakshatra") + '</span><span class="v">' + T.ui.esc(computed.raw.nakshatra) + "</span>" +
      '<span class="hint">' + T.ui.t("occasionForm.ends", { time: fmtTime(computed.nakshatraEnds) }) + "</span></div>" +
      "</div>" +
      (mismatch ? '<p class="warn-note">⚠ ' + T.ui.t(mismatch) + "</p>" : "") +

      '<div class="panchang-mode">' +
      (auto
        ? '<span class="chip-badge">' + T.ui.t("occasionForm.auto_on") + "</span>"
        : '<span class="chip-badge manual">' + T.ui.t("occasionForm.manual_on") + '</span> <button type="button" class="btn secondary small" id="btn-recalc">' + T.ui.t("occasionForm.recalc") + "</button>") +
      "</div>" +

      '<div class="field-row">' +
      '<div class="field"><label>' + T.ui.t("occasionForm.samvatsara") + '</label><select data-p="samvatsara"' + dis + ">" +
      opts(T.data.samvatsaras, raw.samvatsara, function (x) { return x; }, function (x) { return x; }) + "</select></div>" +
      '<div class="field"><label>' + T.ui.t("occasionForm.masa") + '</label><select data-p="masa"' + dis + ">" + masaOptions + "</select></div>" +
      '<div class="field"><label>' + T.ui.t("occasionForm.vasara") + '</label><select data-p="vasara"' + dis + ">" +
      opts(T.data.vasaras, raw.vasara, function (x) { return x; }, function (x) { return x; }) + "</select></div>" +
      "</div>" +
      '<div class="field-row">' +
      '<div class="field"><label>' + T.ui.t("occasionForm.paksha") + '</label><select data-p="paksha"' + dis + ">" +
      opts(T.data.paksha, raw.paksha, function (p) { return p.key; }, function (p) { return p.loc; }) + "</select></div>" +
      '<div class="field"><label>' + T.ui.t("occasionForm.tithi") + '</label><select data-p="tithi"' + dis + ">" +
      opts(T.data.tithis, raw.tithi, function (t) { return t.key; }, tithiLabel) + "</select></div>" +
      '<div class="field"><label>' + T.ui.t("occasionForm.ayana") + '</label><input type="text" readonly value="' + T.ui.esc(raw.ayana || "") + '"></div>' +
      '<div class="field"><label>' + T.ui.t("occasionForm.ritu") + '</label><input type="text" readonly value="' + T.ui.esc(raw.ritu || "") + '"></div>' +
      "</div>" +
      '<div class="field-row">' +
      '<div class="field"><label>' + T.ui.t("occasionForm.nakshatra") + '</label><select data-p="nakshatra"' + dis + ">" +
      opts(T.data.nakshatras, raw.nakshatra, function (n) { return n; }, function (n) { return n; }) + "</select></div>" +
      '<div class="field"><label>' + T.ui.t("occasionForm.yoga") + '</label><select data-p="yoga"' + dis + ">" +
      opts(T.data.yogas, raw.yoga, function (n) { return n; }, function (n) { return n; }) + "</select></div>" +
      '<div class="field"><label>' + T.ui.t("occasionForm.karana") + '</label><select data-p="karana"' + dis + ">" +
      opts(T.data.karanas, raw.karana, function (n) { return n; }, function (n) { return n; }) + "</select></div>" +
      "</div>" +
      '<p class="verify-notice">' + T.ui.t("occasionForm.hint_auto") + "</p>" +
      "</div>" +
      (ui.occasion === "mahalaya" || ui.occasion === "mahalaya_amavasya" ? mahalayaCard(s, loc) : "");

    container.querySelectorAll("[data-occasion]").forEach(function (b) {
      b.addEventListener("click", function () { T.store.setUI({ occasion: b.getAttribute("data-occasion") }); });
    });
    container.querySelector("#occ-usenow").addEventListener("change", function (e) {
      T.ui.recomputePanchang({ useNow: e.target.checked });
    });
    container.querySelector("#occ-datetime").addEventListener("change", function (e) {
      if (e.target.value) T.ui.recomputePanchang({ useNow: false, datetime: e.target.value });
    });
    container.querySelector("#occ-location").addEventListener("change", function (e) {
      T.ui.recomputePanchang({ locationKey: e.target.value });
    });
    container.querySelectorAll("[data-st]").forEach(function (el) {
      el.addEventListener("change", function () {
        T.store.updateProfile(function (p) { p.settings[el.getAttribute("data-st")] = el.value; });
      });
    });
    // Picking a planner day sets the date (keeps the chosen time of day, default 1 pm).
    container.querySelectorAll("[data-pick-date]").forEach(function (row) {
      row.addEventListener("click", function () {
        var cur = T.store.get().ui.datetime || "";
        var time = T.store.get().ui.useNow === false && cur.length >= 16 ? cur.slice(11, 16) : "13:00";
        T.ui.recomputePanchang({ useNow: false, datetime: row.getAttribute("data-pick-date") + "T" + time });
      });
    });
    var recalc = container.querySelector("#btn-recalc");
    if (recalc) recalc.addEventListener("click", function () { T.ui.recomputePanchang({ panchangAuto: true }); });

    // Editing a value by hand switches to manual mode (kept until "Recalculate").
    container.querySelectorAll("[data-p]").forEach(function (el) {
      el.addEventListener("change", function () {
        var patch = {};
        patch[el.getAttribute("data-p")] = el.value;
        var p = Object.assign({}, T.store.get().ui.panchang, patch);
        if (el.getAttribute("data-p") === "masa" && masaSystem !== "lunar") {
          p.ayana = T.panchang.ayanaFromMasa(el.value);
          p.ritu = T.panchang.rituFromMasa(el.value);
        }
        T.store.setUI({ panchang: p, panchangAuto: false });
      });
    });
  };
})(window.Thar);

/* ---- js/ui/form-relatives.js ---- */
/* js/ui/form-relatives.js — Karunya pitrus section (spec §9.2 #3, §2.7). */
window.Thar = window.Thar || {};
(function (T) {
  T.ui = T.ui || {};

  var QUICK_ADD = ["jyeshtha_pitrvya", "kanishtha_pitrvya", "matula", "pitr_bhagini", "sapatni_matr", "svasura", "pet"];

  function relationOptionsHtml(selected) {
    return T.data.relations.map(function (r) {
      return '<option value="' + r.key + '"' + (r.key === selected ? " selected" : "") + ">" + T.ui.esc(T.ui.t(r.labelKey)) + "</option>";
    }).join("");
  }

  T.ui.renderKarunya = function (container) {
    var profile = T.store.get().profile;
    var karunya = profile.karunya || [];

    container.innerHTML =
      '<div class="card"><h2>' + T.ui.t("karunya.title") + "</h2>" +
      '<div class="chip-row">' + QUICK_ADD.map(function (key) {
        var rel = T.data.getRelation(key);
        return '<span class="chip" data-quick="' + key + '">+ ' + T.ui.esc(T.ui.t(rel.labelKey)) + "</span>";
      }).join("") + "</div>" +
      '<div class="karunya-list">' +
      (karunya.length ? karunya.map(function (entry, idx) { return karunyaItemHtml(entry, idx, profile); }).join("") : '<p>' + T.ui.t("karunya.empty") + "</p>") +
      "</div>" +
      '<button class="btn" id="btn-add-relative" style="margin-top:10px;">' + T.ui.t("action.add_relative") + "</button>" +
      "</div>";

    container.querySelectorAll("[data-quick]").forEach(function (chip) {
      chip.addEventListener("click", function () {
        T.store.updateProfile(function (p) {
          p.karunya = p.karunya || [];
          p.karunya.push({ relation: chip.getAttribute("data-quick"), name: "", gotra: null, gender: T.data.getRelation(chip.getAttribute("data-quick")).gender, alive: false, include: true });
        });
      });
    });
    var addBtn = container.querySelector("#btn-add-relative");
    if (addBtn) addBtn.addEventListener("click", function () {
      T.store.updateProfile(function (p) {
        p.karunya = p.karunya || [];
        p.karunya.push({ relation: "other", name: "", gotra: null, gender: "M", alive: false, include: true });
      });
    });

    container.querySelectorAll(".karunya-item").forEach(function (item) {
      var idx = parseInt(item.getAttribute("data-idx"), 10);
      item.querySelectorAll("[data-field]").forEach(function (el) {
        el.addEventListener("change", function () {
          T.store.updateProfile(function (p) {
            var entry = p.karunya[idx];
            var field = el.getAttribute("data-field");
            entry[field] = el.type === "checkbox" ? el.checked : el.value;
            if (field === "relation") entry.gender = T.data.getRelation(el.value).gender;
          });
        });
      });
      var nameInput = item.querySelector('input[data-field="name"]');
      if (nameInput) nameInput.addEventListener("input", function () {
        T.store.updateProfileQuiet(function (p) { p.karunya[idx].name = nameInput.value; });
      });
      var removeBtn = item.querySelector(".btn-remove");
      if (removeBtn) removeBtn.addEventListener("click", function () {
        T.store.updateProfile(function (p) { p.karunya.splice(idx, 1); });
      });
    });
  };

  function karunyaItemHtml(entry, idx, profile) {
    var inferred = T.engine.resolveKarunyaGotra(entry, profile);
    var isPet = entry.relation === "pet";
    return (
      '<div class="karunya-item" data-idx="' + idx + '">' +
      '<div class="field-row">' +
      '<div class="field"><label>' + T.ui.t("karunya.relation") + '</label><select data-field="relation">' + relationOptionsHtml(entry.relation) + "</select></div>" +
      '<div class="field"><label>' + T.ui.t("karunya.name") + '</label><input type="text" data-field="name" value="' + T.ui.esc(entry.name || "") + '"></div>' +
      (isPet
        ? '<div class="field"><label>' + T.ui.t("karunya.species") + '</label><select data-field="species">' +
          Object.keys(T.data.petSpecies).map(function (sp) {
            return '<option value="' + sp + '"' + ((entry.species || "dog") === sp ? " selected" : "") + ">" + T.ui.esc(T.ui.t("karunya.species." + sp)) + "</option>";
          }).join("") + "</select></div>"
        : '<div class="field"><label>' + T.ui.t("karunya.gotra") + (entry.gotra ? "" : ' <span class="chip-badge">' + T.ui.t("karunya.inferred") + "</span>") + '</label>' +
          '<input type="text" data-field="gotra" placeholder="' + T.ui.esc(inferred.gotra) + '" value="' + T.ui.esc(entry.gotra || "") + '"></div>') +
      "</div>" +
      '<label style="font-size:13px;"><input type="checkbox" data-field="alive" ' + (entry.alive ? "checked" : "") + "> " + T.ui.t("karunya.alive") + "</label> " +
      '<button type="button" class="btn danger small btn-remove">&times; ' + T.ui.t("action.remove") + "</button>" +
      "</div>"
    );
  }
})(window.Thar);

/* ---- js/ui/preview.js ---- */
/* js/ui/preview.js — the live generated script (spec §9.2 #4): validation panel, ordered
   step cards, poonal badges/banners, tap counters, editable blocks with overrides. */
window.Thar = window.Thar || {};
(function (T) {
  T.ui = T.ui || {};

  // Builds { profile, occasionKey, panchang } from current store state, ready for the engine.
  T.ui.buildContext = function () {
    var s = T.store.get();
    var occasionKey = s.ui.occasion || "amavasya";
    var date = T.ui.currentMoment();
    var st = s.profile.settings || {};
    var panchang = T.panchang.resolve(s.ui.panchang || {}, date, { masaSystem: st.masaSystem, changeStyle: st.changeStyle });
    return { profile: s.profile, occasionKey: occasionKey, panchang: panchang, date: date };
  };

  T.ui.getProcedureResult = function () {
    var ctx = T.ui.buildContext();
    var overrides = T.store.get().ui.ruleOverrides || {};
    return { result: T.engine.buildProcedure(ctx.profile, ctx.occasionKey, ctx.panchang, { overrides: overrides }), ctx: ctx };
  };

  function poonalBadge(state) {
    if (!state) return "";
    return '<span class="poonal-badge ' + state + '">' + T.ui.t("poonal." + state + ".label") + " · " + T.ui.t("poonal." + state + ".sanskrit") + "</span>";
  }

  function tapCounterHtml(id, target) {
    var counts = T.store.get().ui.tapCounts || {};
    var n = counts[id] || 0;
    return '<span class="tap-counter' + (n >= target ? " complete" : "") + '" data-tap="' + id + '" data-target="' + target + '">' + n + " / " + target + "</span>";
  }

  function editableLine(occasionKey, stepId, lineId, text) {
    var override = T.store.getOverride(occasionKey, stepId, lineId);
    var shown = override !== undefined ? override : text;
    return (
      '<span class="mantra-text" contenteditable="true" data-occ="' + occasionKey + '" data-step="' + stepId + '" data-line="' + lineId + '">' +
      T.ui.esc(T.ui.tr(shown)) + "</span>" +
      (override !== undefined ? '<span class="edit-reset" data-reset-occ="' + occasionKey + '" data-reset-step="' + stepId + '" data-reset-line="' + lineId + '">' + T.ui.t("action.reset") + "</span>" : "")
    );
  }

  function renderMaterials(items) {
    return '<ul class="checklist">' + items.map(function (it) {
      if (typeof it === "string") return "<li>" + T.ui.t(it) + "</li>";
      return "<li>" + T.ui.t(it.key) + " × " + it.count + "</li>";
    }).join("") + "</ul>";
  }

  // Chips for facing / theertham / pavitram, shared with recital mode.
  T.ui.stepChipsHtml = function (step) {
    var chips = [];
    if (step.facing) chips.push('<span class="step-chip">🧭 ' + T.ui.esc(T.ui.t("chip.facing." + step.facing)) + "</span>");
    if (step.theertham) chips.push('<span class="step-chip">💧 ' + T.ui.esc(T.ui.t("chip.theertham." + step.theertham)) + "</span>");
    if (step.pavitram) chips.push('<span class="step-chip">◯ ' + T.ui.esc(T.ui.t("chip.pavitram")) + "</span>");
    return chips.length ? '<div class="step-chips">' + chips.join("") + "</div>" : "";
  };

  // Numbered physical instructions (step.<id>.do, one per line), shared with recital mode.
  T.ui.stepDoHtml = function (step, open) {
    var text = T.ui.t(step.doKey);
    if (!text || text === step.doKey) return "";
    return '<details class="do-block"' + (open ? " open" : "") + "><summary>" + T.ui.t("step.do_title") + "</summary>" +
      '<ol class="do-list">' + text.split("\n").map(function (l) { return "<li>" + T.ui.esc(l) + "</li>"; }).join("") + "</ol></details>";
  };

  function renderStepContent(step, occasionKey) {
    var c = step.content;
    if (c.type === "checklist") return renderMaterials(c.items);
    if (c.type === "instruction" || c.type === "info") return "";
    if (c.type === "mantra" || (c.type === "generated" && c.lines)) {
      return '<div class="mantra-block">' + c.lines.map(function (line, i) {
        return '<div class="mantra-line">' + editableLine(occasionKey, step.id, "l" + i, line) + "</div>";
      }).join("") + "</div>";
    }
    if (c.type === "tarpana") {
      return '<div class="mantra-block">' + c.lines.map(function (line, i) {
        var tapId = occasionKey + "|" + step.id + "|" + i;
        return '<div class="mantra-line">' + editableLine(occasionKey, step.id, "l" + i, line) + tapCounterHtml(tapId, c.counts[i]) + "</div>";
      }).join("") + "</div>";
    }
    if (c.type === "generated") {
      return '<div class="mantra-block mantra-line">' + editableLine(occasionKey, step.id, "text", c.text) + "</div>";
    }
    return "";
  }

  T.ui.stepTitle = function (step) { return step.custom ? (step.title || T.ui.t("step.custom.title")) : T.ui.t(step.titleKey); };

  // Lines the user added to a step (profile.extraLines[stepId]); editable and removable.
  function extraLinesHtml(step) {
    if (!step.extraLines || !step.extraLines.length) return "";
    return '<div class="mantra-block extra-lines">' + step.extraLines.map(function (l, i) {
      return '<div class="mantra-line"><span class="mantra-text" contenteditable="true" data-extra-step="' + step.id + '" data-extra-idx="' + i + '">' +
        T.ui.esc(T.ui.tr(l)) + '</span><button type="button" class="icon-btn small no-print" data-extra-remove="' + step.id + '" data-idx="' + i + '" aria-label="' +
        T.ui.esc(T.ui.t("action.remove")) + '">✕</button></div>';
    }).join("") + "</div>";
  }

  // Controls to add the mantras the vadhyar says that the script is missing.
  function addControlsHtml(step) {
    return '<div class="step-add no-print">' +
      '<button type="button" class="btn secondary small" data-add-line="' + step.id + '">+ ' + T.ui.t("step.add_line") + "</button>" +
      '<button type="button" class="btn secondary small" data-add-step="' + step.id + '">+ ' + T.ui.t("step.add_step") + "</button>" +
      (step.custom ? '<button type="button" class="btn danger small" data-remove-step="' + step.id + '">' + T.ui.t("step.remove_step") + "</button>" : "") +
      "</div>";
  }

  function stepCardHtml(step, occasionKey, compact) {
    var body = renderStepContent(step, occasionKey);
    var isMantra = step.content.type !== "checklist" && body;
    var titleHtml = step.custom
      ? '<span class="mantra-text" contenteditable="true" data-custom-title="' + step.id + '">' + T.ui.esc(T.ui.stepTitle(step)) + "</span>"
      : T.ui.esc(T.ui.stepTitle(step));
    return (
      '<div class="step-card' + (step.custom ? " custom-step" : "") + '" data-step-id="' + step.id + '">' +
      '<div class="step-head">' +
      '<span class="step-title">' + titleHtml + '<span class="step-num"> · #' + step.n + "</span></span>" +
      (step.poonal ? poonalBadge(step.poonal) : "") +
      (step.koorcham ? '<span class="koorcham-tag">' + T.ui.t("step.koorcham", { n: step.koorcham }) + "</span>" : "") +
      (step.optional ? '<span class="koorcham-tag">' + T.ui.t("step.optional") + "</span>" : "") +
      "</div>" +
      T.ui.stepChipsHtml(step) +
      (step.instructionKey ? '<p class="step-instruction">' + T.ui.esc(T.ui.t(step.instructionKey)) + "</p>" : "") +
      (step.instructionKey ? T.ui.stepDoHtml(step, !compact) : "") +
      (isMantra || step.extraLines.length ? '<div class="say-label">' + T.ui.t("step.mantra_title") + "</div>" : "") +
      body +
      extraLinesHtml(step) +
      (compact ? "" : addControlsHtml(step)) +
      "</div>"
    );
  }

  function validationPanelHtml(result) {
    if (result.blocked) {
      return '<div class="validation-panel blocks"><h3>' + T.ui.t("validation.blocks") + "</h3>" +
        result.blocks.map(function (b) {
          return '<div class="validation-item block">' + T.ui.esc(T.ui.t(b.messageKey)) +
            (b.overridable ? ' <button class="btn secondary" data-override-rule="' + b.ruleId + '" style="margin-left:8px;">' + T.ui.t("action.override") + "</button>" : "") +
            "</div>";
        }).join("") + "</div>";
    }
    var warnings = result.warnings || [];
    return '<div class="validation-panel ok"><h3>' + T.ui.t("validation.title") + "</h3>" +
      (warnings.length ? warnings.map(function (w) {
        return '<div class="validation-item warning">⚠ ' + T.ui.esc(T.ui.t(w.messageKey)) + "</div>";
      }).join("") : '<div class="validation-item">✓ ' + T.ui.t("validation.none") + "</div>") +
      '<div class="verify-notice">⚠ ' + T.ui.t("validation.verify_notice") + "</div>" +
      "</div>";
  }

  function stepsHtml(steps, occasionKey, compact) {
    var out = "";
    var lastPass = null;
    steps.forEach(function (item) {
      if (item.pass && item.pass !== lastPass) {
        out += '<div class="pass-divider">' + T.ui.t(item.pass === "karunya" ? "pass.karunya" : "pass.amavasya") + "</div>";
        lastPass = item.pass;
      }
      if (item.type === "poonal_change") {
        out += '<div class="poonal-change-banner ' + item.to + '">' + T.ui.t("poonal.change_to", { label: T.ui.t("poonal." + item.to + ".label") }) + "</div>";
      } else {
        out += stepCardHtml(item, occasionKey, compact);
      }
    });
    return out;
  }

  T.ui.renderPreview = function (container, opts) {
    opts = opts || {};
    var built = T.ui.getProcedureResult();
    var result = built.result, ctx = built.ctx;

    var html = validationPanelHtml(result);
    if (!result.blocked) {
      html += '<div class="no-print" style="margin-bottom:12px;">' +
        '<button class="btn secondary" id="btn-reset-all">' + T.ui.t("action.reset_all") + "</button> " +
        '<a class="btn secondary" href="#recital">' + T.ui.t("action.start_recital") + "</a>" +
        "</div>";
      html += stepsHtml(result.steps, ctx.occasionKey, !!opts.compact);
    }
    container.innerHTML = html;

    container.querySelectorAll("[data-override-rule]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var ro = Object.assign({}, T.store.get().ui.ruleOverrides || {});
        ro[btn.getAttribute("data-override-rule")] = true;
        T.store.setUI({ ruleOverrides: ro });
      });
    });
    container.querySelectorAll("[contenteditable][data-step]").forEach(function (el) {
      el.addEventListener("blur", function () {
        var custom = (T.store.get().profile.customSteps || []).filter(function (c) { return c.id === el.getAttribute("data-step"); })[0];
        if (custom) {
          var i = +el.getAttribute("data-line").slice(1);
          T.store.updateProfile(function (p) {
            var c = p.customSteps.filter(function (x) { return x.id === custom.id; })[0];
            c.lines[i] = el.textContent.trim();
          });
          return;
        }
        T.store.setOverride(el.getAttribute("data-occ"), el.getAttribute("data-step"), el.getAttribute("data-line"), el.textContent);
      });
    });
    container.querySelectorAll("[data-reset-occ]").forEach(function (el) {
      el.addEventListener("click", function () {
        T.store.resetOverride(el.getAttribute("data-reset-occ"), el.getAttribute("data-reset-step"), el.getAttribute("data-reset-line"));
      });
    });
    container.querySelectorAll("[data-tap]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-tap");
        var target = parseInt(el.getAttribute("data-target"), 10);
        var counts = Object.assign({}, T.store.get().ui.tapCounts || {});
        counts[id] = ((counts[id] || 0) + 1) % (target + 1);
        T.store.setUI({ tapCounts: counts });
      });
    });
    // Added lines and steps live in the profile (so they export with it).
    function on(sel, evt, fn) { container.querySelectorAll(sel).forEach(function (el) { el.addEventListener(evt, function () { fn(el); }); }); }
    on("[data-add-line]", "click", function (el) {
      var id = el.getAttribute("data-add-line");
      T.store.updateProfile(function (p) {
        p.extraLines = p.extraLines || {};
        (p.extraLines[id] = p.extraLines[id] || []).push("");
      });
      var added = document.querySelectorAll('[data-extra-step="' + id + '"]');
      if (added.length) added[added.length - 1].focus();
    });
    on("[data-extra-step]", "blur", function (el) {
      var id = el.getAttribute("data-extra-step"), i = +el.getAttribute("data-extra-idx");
      T.store.updateProfile(function (p) { p.extraLines[id][i] = el.textContent.trim(); });
    });
    on("[data-extra-remove]", "click", function (el) {
      var id = el.getAttribute("data-extra-remove"), i = +el.getAttribute("data-idx");
      T.store.updateProfile(function (p) { p.extraLines[id].splice(i, 1); });
    });
    on("[data-add-step]", "click", function (el) {
      var afterId = el.getAttribute("data-add-step");
      var after = built.result.steps.filter(function (x) { return x.id === afterId; })[0] || {};
      T.store.updateProfile(function (p) {
        p.customSteps = p.customSteps || [];
        var prev = p.customSteps.filter(function (c) { return c.id === afterId; })[0];
        p.customSteps.push({ id: "custom_" + Date.now(), afterId: afterId, anchorId: prev ? (prev.anchorId || prev.afterId) : afterId,
          title: T.ui.t("step.custom.title"), poonal: after.poonal || null, lines: [""] });
      });
    });
    on("[data-custom-title]", "blur", function (el) {
      var id = el.getAttribute("data-custom-title");
      T.store.updateProfile(function (p) {
        var c = (p.customSteps || []).filter(function (x) { return x.id === id; })[0];
        if (c) c.title = el.textContent.trim();
      });
    });
    on("[data-remove-step]", "click", function (el) {
      var id = el.getAttribute("data-remove-step");
      T.store.updateProfile(function (p) { p.customSteps = (p.customSteps || []).filter(function (c) { return c.id !== id; }); });
    });

    var resetAllBtn = container.querySelector("#btn-reset-all");
    if (resetAllBtn) resetAllBtn.addEventListener("click", function () { T.store.resetAllOverrides(); });
  };
})(window.Thar);

/* ---- js/ui/recital.js ---- */
/* js/ui/recital.js — full-screen, one-step-at-a-time recital mode (spec §9.2 #5). */
window.Thar = window.Thar || {};
(function (T) {
  T.ui = T.ui || {};

  var index = 0;
  var wakeLock = null;
  var touchStartX = null;
  var keyHandler = null;

  function items() {
    var built = T.ui.getProcedureResult();
    return built.result.blocked ? [] : built.result.steps;
  }

  function clamp(i, len) { return Math.max(0, Math.min(len - 1, i)); }

  async function requestWakeLock() {
    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
      }
    } catch (e) { wakeLock = null; }
  }

  T.ui.recitalStop = function () {
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
    if (keyHandler) { window.removeEventListener("keydown", keyHandler); keyHandler = null; }
  };

  function lineHtml(occasionKey, stepId, lineId, text) {
    var override = T.store.getOverride(occasionKey, stepId, lineId);
    var shown = override !== undefined ? override : text;
    return T.ui.esc(T.ui.tr(shown));
  }

  function contentHtml(step, occasionKey) {
    var c = step.content;
    if (c.type === "checklist") {
      return c.items.map(function (it) { return typeof it === "string" ? T.ui.t(it) : T.ui.t(it.key) + " × " + it.count; }).join("<br>");
    }
    if (c.type === "instruction" || c.type === "info") return "";
    if (c.type === "mantra" || (c.type === "generated" && c.lines)) {
      return c.lines.map(function (l, i) { return "<div>" + lineHtml(occasionKey, step.id, "l" + i, l) + "</div>"; }).join("");
    }
    if (c.type === "tarpana") {
      return c.lines.map(function (l, i) {
        var tapId = occasionKey + "|" + step.id + "|" + i;
        var counts = T.store.get().ui.tapCounts || {};
        var n = counts[tapId] || 0;
        return '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;">' +
          "<span>" + lineHtml(occasionKey, step.id, "l" + i, l) + '</span><span class="tap-counter' + (n >= c.counts[i] ? " complete" : "") + '" data-recital-tap="' + tapId + '" data-target="' + c.counts[i] + '">' + n + " / " + c.counts[i] + "</span></div>";
      }).join("");
    }
    if (c.type === "generated") return "<div>" + lineHtml(occasionKey, step.id, "text", c.text) + "</div>";
    return "";
  }

  T.ui.renderRecital = function (container) {
    var list = items();
    if (!list.length) {
      container.innerHTML = '<div class="card"><p>' + T.ui.t("recital.blocked") + "</p></div>";
      return;
    }
    index = clamp(index, list.length);
    var occasionKey = T.ui.buildContext().occasionKey;
    var item = list[index];
    requestWakeLock();

    var body;
    if (item.type === "poonal_change") {
      body = '<div class="recital-interstitial"><div class="poonal-change-banner ' + item.to + '" style="font-size:22px;">' +
        T.ui.t("poonal.change_to", { label: T.ui.t("poonal." + item.to + ".label") }) + "</div></div>";
    } else {
      body = '<div class="recital-title">' + T.ui.esc(T.ui.stepTitle(item)) + " (#" + item.n + " / " + list.length + ")</div>" +
        T.ui.stepChipsHtml(item) +
        (item.instructionKey ? '<div class="recital-instruction">' + T.ui.esc(T.ui.t(item.instructionKey)) + "</div>" : "") +
        T.ui.stepDoHtml(item, true) +
        '<div class="recital-body-inner">' + contentHtml(item, occasionKey) +
        (item.extraLines || []).map(function (l) { return "<div>" + T.ui.esc(T.ui.tr(l)) + "</div>"; }).join("") + "</div>";
    }

    var poonalPinned = item.poonal ? item.poonal : (item.type === "poonal_change" ? item.to : null);

    container.innerHTML =
      '<div class="recital-overlay">' +
      (poonalPinned ? '<div class="recital-poonal poonal-badge ' + poonalPinned + '">' + T.ui.t("poonal." + poonalPinned + ".label") + "</div>" : "") +
      '<div class="recital-body">' + body + "</div>" +
      '<div class="recital-nav">' +
      '<button class="btn secondary" id="recital-prev">&larr; ' + T.ui.t("action.prev") + "</button>" +
      '<button class="btn secondary" id="recital-exit">' + T.ui.t("action.exit_recital") + "</button>" +
      '<button class="btn" id="recital-next">' + T.ui.t("action.next") + " &rarr;</button>" +
      "</div></div>";

    function go(delta) {
      index = clamp(index + delta, list.length);
      T.ui.renderRecital(container);
    }
    container.querySelector("#recital-prev").addEventListener("click", function () { go(-1); });
    container.querySelector("#recital-next").addEventListener("click", function () { go(1); });
    container.querySelector("#recital-exit").addEventListener("click", function () {
      window.location.hash = "#script";
    });
    container.querySelectorAll("[data-recital-tap]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-recital-tap");
        var target = parseInt(el.getAttribute("data-target"), 10);
        var counts = Object.assign({}, T.store.get().ui.tapCounts || {});
        counts[id] = ((counts[id] || 0) + 1) % (target + 1);
        T.store.setUI({ tapCounts: counts });
      });
    });

    if (keyHandler) window.removeEventListener("keydown", keyHandler);
    keyHandler = function (e) {
      if (e.key === "ArrowRight") go(1);
      else if (e.key === "ArrowLeft") go(-1);
    };
    window.addEventListener("keydown", keyHandler);

    var overlay = container.querySelector(".recital-overlay");
    overlay.addEventListener("touchstart", function (e) { touchStartX = e.touches[0].clientX; }, { passive: true });
    overlay.addEventListener("touchend", function (e) {
      if (touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
      touchStartX = null;
    }, { passive: true });
  };
})(window.Thar);

/* ---- js/ui/print.js ---- */
/* js/ui/print.js — Abhivadaye tab + Print/export section (spec §9.2 #6, #7).
   The printed booklet has its own renderer (not the editable script): a header with the
   occasion, panchang and kartha, then numbered steps with plain-text poonal/facing notes,
   mantras in large type and tick boxes for the tharpanam counts. Ctrl/Cmd+P from any section
   prints the same booklet (rendered into #print-root on beforeprint). */
window.Thar = window.Thar || {};
(function (T) {
  T.ui = T.ui || {};

  T.ui.renderAbhivadaye = function (container) {
    var profile = T.store.get().profile;
    var abh = T.engine.renderAbhivadaye(profile.kartha);
    container.innerHTML =
      '<div class="card abhivadaye-card">' +
      '<h2>' + T.ui.t("abhivadaye.title") + "</h2>" +
      '<div class="abhivadaye-text" id="abhivadaye-text">' + T.ui.esc(T.ui.tr(abh.text)) + "</div>" +
      '<p class="verify-notice">' + T.ui.t(abh.rishiCount === 1 ? "abhivadaye.rishi_count_one" : "abhivadaye.rishi_count", { n: abh.rishiCount }) + " (" + abh.countWord + " ārṣeya) — " + T.ui.t("notice.verify") + "</p>" +
      '<button class="btn no-print" id="btn-copy-abhivadaye">' + T.ui.t("abhivadaye.copy") + "</button>" +
      "</div>";
    var btn = container.querySelector("#btn-copy-abhivadaye");
    btn.addEventListener("click", function () {
      var text = container.querySelector("#abhivadaye-text").textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function () {});
      }
    });
  };

  var DEFAULTS = { paper: "A4", size: "m", density: "compact", howTo: true, materials: true, abhivadaye: true, boxes: true };
  function printOpts() { return Object.assign({}, DEFAULTS, T.store.get().ui.print || {}); }

  var esc = function (s) { return T.ui.esc(s); };
  var say = function (s) { return esc(T.ui.tr(s)); };

  function shown(occ, stepId, lineId, text) {
    var o = T.store.getOverride(occ, stepId, lineId);
    return o !== undefined ? o : text;
  }

  // Full tag in the legend; steps show just the Sanskrit name (the legend explains it).
  function poonalTag(state, short) {
    return '<span class="p-poonal ' + state + '">' + esc(T.ui.t("poonal." + state + ".sanskrit")) +
      (short ? "" : " · " + esc(T.ui.t("poonal." + state + ".label"))) + "</span>";
  }

  function boxes(n) {
    var b = "";
    for (var i = 0; i < n; i++) b += '<span class="p-box"></span>';
    return '<span class="p-count">×' + n + " " + b + "</span>";
  }

  function stepBody(step, occ, opts) {
    var c = step.content, out = "";
    if (c.type === "checklist") {
      if (!opts.materials) return "";
      return '<ul class="p-materials">' + c.items.map(function (it) {
        return "<li>" + (typeof it === "string" ? esc(T.ui.t(it)) : esc(T.ui.t(it.key)) + " × " + it.count) + "</li>";
      }).join("") + "</ul>";
    }
    if (c.type === "tarpana") {
      out = '<ol class="p-lines p-tarpana">' + c.lines.map(function (l, i) {
        return '<li><span class="p-text">' + say(shown(occ, step.id, "l" + i, l)) + "</span>" +
          (opts.boxes ? boxes(c.counts[i]) : '<span class="p-count">×' + c.counts[i] + "</span>") + "</li>";
      }).join("") + "</ol>";
    } else if (c.lines) {
      out = '<div class="p-lines">' + c.lines.map(function (l, i) {
        return l ? '<p class="p-text">' + say(shown(occ, step.id, "l" + i, l)) + "</p>" : "";
      }).join("") + "</div>";
    } else if (c.type === "generated" && c.text) {
      out = '<div class="p-lines">' + shown(occ, step.id, "text", c.text).split("\n").map(function (l) {
        return '<p class="p-text">' + say(l) + "</p>";
      }).join("") + "</div>";
    }
    if (step.extraLines && step.extraLines.length) {
      out += '<div class="p-lines">' + step.extraLines.filter(Boolean).map(function (l) { return '<p class="p-text">' + say(l) + "</p>"; }).join("") + "</div>";
    }
    return out;
  }

  function stepHtml(step, occ, opts) {
    var notes = [];
    if (step.facing) notes.push(T.ui.t("chip.facing." + step.facing));
    if (step.theertham) notes.push(T.ui.t("chip.theertham." + step.theertham));
    if (step.pavitram) notes.push(T.ui.t("chip.pavitram"));
    if (step.koorcham) notes.push(T.ui.t("step.koorcham", { n: step.koorcham }));
    if (step.optional) notes.push(T.ui.t("step.optional"));
    var doText = step.doKey ? T.ui.t(step.doKey) : "";
    var howTo = "";
    if (opts.howTo && doText && doText !== step.doKey) {
      var items = doText.split("\n");
      // Compact: one running paragraph "1. … 2. …"; spacious: a numbered list.
      howTo = opts.density === "compact"
        ? '<p class="p-howto">' + items.map(function (l, i) { return "<b>" + (i + 1) + ".</b> " + esc(l); }).join(" ") + "</p>"
        : '<ol class="p-howto">' + items.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ol>";
    }
    var body = stepBody(step, occ, opts);
    var instruction = step.instructionKey ? '<p class="p-instr">' + esc(T.ui.t(step.instructionKey)) + "</p>" : "";
    if (step.content.type === "checklist" && !opts.materials) return "";
    return '<section class="p-step">' +
      '<div class="p-step-head"><span class="p-num">' + step.n + '</span><h3 class="p-title">' + esc(T.ui.stepTitle(step)) + "</h3>" +
      (step.poonal ? poonalTag(step.poonal, true) : "") + "</div>" +
      (notes.length ? '<p class="p-notes">' + notes.map(esc).join(" · ") + "</p>" : "") +
      instruction + howTo + body + "</section>";
  }

  function headerHtml(ctx) {
    var p = ctx.panchang, k = ctx.profile.kartha || {};
    var loc = T.data.getLocation(T.store.get().ui.locationKey);
    var d = ctx.date;
    var dateStr = d.toLocaleDateString(T.i18n.lang === "ta" ? "ta-IN" : "en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) +
      " · " + d.toLocaleTimeString(T.i18n.lang === "ta" ? "ta-IN" : "en-IN", { hour: "numeric", minute: "2-digit" });
    var cells = [
      ["print.samvatsara", p.samvatsara], ["print.masa", p.masa], ["print.paksha", p.paksha],
      ["print.tithi", p.tithi_loc], ["print.vasara", p.vasara], ["print.nakshatra", p.nakshatra]
    ].filter(function (c) { return c[1]; });
    var gotra = T.engine.spokenGotra(k.gotraOverride || k.gotra || "");
    var who = [k.name, k.sharmaName && k.sharmaName !== k.name ? "(" + k.sharmaName + " " + (k.nameSuffix || "śarmā") + ")" : ""].filter(Boolean).join(" ");
    return '<header class="p-header">' +
      '<div class="p-om">ॐ</div>' +
      '<h1 class="p-occasion">' + esc(T.ui.t("occasion." + ctx.occasionKey)) + "</h1>" +
      '<p class="p-date">' + esc(dateStr) + (loc ? " · " + esc(loc.label) : "") + "</p>" +
      '<dl class="p-panchang">' + cells.map(function (c) {
        return "<div><dt>" + esc(T.ui.t(c[0])) + "</dt><dd>" + say(c[1]) + "</dd></div>";
      }).join("") + "</dl>" +
      (who || gotra ? '<p class="p-kartha">' + esc(T.ui.t("print.kartha")) + ": <b>" + esc(who) + "</b>" +
        (gotra ? " · " + esc(T.ui.t("print.gotra")) + ": <b>" + say(gotra) + "</b>" : "") + "</p>" : "") +
      '<p class="p-legend">' + ["upaveeti", "pracheenaveeti", "niveeti"].map(poonalTag).join(" ") + "</p>" +
      "</header>";
  }

  // Builds the printable booklet HTML for the current profile/occasion.
  T.ui.printSheetHtml = function () {
    var opts = printOpts();
    var built = T.ui.getProcedureResult();
    var result = built.result, ctx = built.ctx;
    var cls = "print-sheet paper-" + opts.paper.toLowerCase() + " size-" + opts.size + " " + opts.density;
    if (result.blocked) {
      return '<div class="' + cls + '">' + headerHtml(ctx) + '<p class="p-blocked">' + esc(T.ui.t("recital.blocked")) + "</p>" +
        result.blocks.map(function (b) { return "<p>• " + esc(T.ui.t(b.messageKey)) + "</p>"; }).join("") + "</div>";
    }
    var body = "", lastPass = null;
    result.steps.forEach(function (item) {
      if (item.pass && item.pass !== lastPass) {
        body += '<h2 class="p-pass">' + esc(T.ui.t(item.pass === "karunya" ? "pass.karunya" : "pass.amavasya")) + "</h2>";
        lastPass = item.pass;
      }
      if (item.type === "poonal_change") {
        body += '<div class="p-change ' + item.to + '">⟳ ' + esc(T.ui.t("poonal.change_to", { label: T.ui.t("poonal." + item.to + ".sanskrit") + " (" + T.ui.t("poonal." + item.to + ".label") + ")" })) + "</div>";
      } else {
        body += stepHtml(item, ctx.occasionKey, opts);
      }
    });
    if (opts.abhivadaye) {
      var abh = T.engine.renderAbhivadaye(ctx.profile.kartha || {});
      body += '<section class="p-step p-abhivadaye"><h3 class="p-title">' + esc(T.ui.t("abhivadaye.title")) + '</h3><p class="p-text">' + say(abh.text) + "</p></section>";
    }
    return '<div class="' + cls + '">' + headerHtml(ctx) + body +
      '<footer class="p-footer">' + esc(T.ui.t("print.footer")) + "</footer></div>";
  };

  // @page can't be switched with a class, so the paper size is a small injected rule.
  function applyPageSize() {
    var opts = printOpts();
    var el = document.getElementById("print-page-style");
    if (!el) { el = document.createElement("style"); el.id = "print-page-style"; document.head.appendChild(el); }
    el.textContent = "@page { size: " + opts.paper + "; margin: " + (opts.paper === "A5" ? "10mm 10mm" : "12mm 13mm") + "; }";
  }

  function seg(key, current, options) {
    return '<div class="seg" role="radiogroup">' + options.map(function (o) {
      var on = String(current) === o[0];
      return '<button type="button" class="seg-btn' + (on ? " active" : "") + '" data-print-opt="' + key + '" data-val="' + o[0] + '" aria-pressed="' + on + '">' + esc(o[1]) + "</button>";
    }).join("") + "</div>";
  }
  function check(key, on) {
    return '<label class="check"><input type="checkbox" data-print-check="' + key + '"' + (on ? " checked" : "") + "> " + esc(T.ui.t("print.opt." + key)) + "</label>";
  }

  function setOpt(key, val) {
    var cur = Object.assign({}, T.store.get().ui.print || {});
    cur[key] = val;
    T.store.setUI({ print: cur });
  }

  T.ui.renderPrint = function (container) {
    var opts = printOpts();
    var sheet = T.ui.printSheetHtml();
    container.innerHTML =
      '<div class="card no-print print-options"><h2>' + T.ui.t("print.title") + "</h2>" +
      '<div class="field-row">' +
      '<div class="field"><label>' + T.ui.t("print.paper") + "</label>" + seg("paper", opts.paper, [["A4", "A4"], ["A5", "A5"]]) + "</div>" +
      '<div class="field"><label>' + T.ui.t("print.density") + "</label>" + seg("density", opts.density,
        [["compact", T.ui.t("print.density.compact")], ["comfortable", T.ui.t("print.density.comfortable")]]) + "</div>" +
      '<div class="field"><label>' + T.ui.t("print.size") + "</label>" + seg("size", opts.size,
        [["s", T.ui.t("print.size.s")], ["m", T.ui.t("print.size.m")], ["l", T.ui.t("print.size.l")]]) + "</div>" +
      "</div>" +
      '<div class="print-checks">' + check("howTo", opts.howTo) + check("materials", opts.materials) + check("boxes", opts.boxes) + check("abhivadaye", opts.abhivadaye) + "</div>" +
      '<p class="hint">' + T.ui.t("print.hint") + "</p>" +
      '<div class="btn-row"><button class="btn" id="btn-print">🖨 ' + T.ui.t("action.print") + "</button></div>" +
      "</div>" +
      '<div class="print-stage">' + sheet + "</div>";
    fillPrintRoot(sheet);
    container.querySelector("#btn-print").addEventListener("click", function () { window.print(); });
    container.querySelectorAll("[data-print-opt]").forEach(function (b) {
      b.addEventListener("click", function () { setOpt(b.getAttribute("data-print-opt"), b.getAttribute("data-val")); });
    });
    container.querySelectorAll("[data-print-check]").forEach(function (el) {
      el.addEventListener("change", function () { setOpt(el.getAttribute("data-print-check"), el.checked); });
    });
  };

  // Printing from any section prints the booklet, never the editing screen. The print section
  // fills #print-root as it renders; elsewhere it is filled just before the print dialog opens.
  function fillPrintRoot(html) {
    var root = document.getElementById("print-root");
    if (!root || !T.store.get().profile) return;
    applyPageSize();
    try { root.innerHTML = html || T.ui.printSheetHtml(); } catch (e) { root.innerHTML = ""; }
  }
  window.addEventListener("beforeprint", function () { fillPrintRoot(); });
  if (window.matchMedia) {
    var mq = window.matchMedia("print");
    var onChange = function (e) { if (e.matches) fillPrintRoot(); };
    if (mq.addEventListener) mq.addEventListener("change", onChange); else if (mq.addListener) mq.addListener(onChange);
  }
})(window.Thar);

/* ---- js/app.js ---- */
/* js/app.js — bootstrap + hash router (spec §7.2, §9). */
window.Thar = window.Thar || {};
(function (T) {
  T.ui = T.ui || {};

  // ---- Shared UI helpers ----
  T.ui.t = function (key, vars) { return T.i18n.t(key, vars); };
  T.ui.tr = function (text) { return T.translit.toScript(text, T.store.get().ui.script || "iast"); };
  T.ui.esc = function (s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };

  var SECTIONS = ["profile", "occasion", "karunya", "script", "recital", "abhivadaye", "print"];
  var RENDERERS = {
    profile: T.ui.renderProfile, occasion: T.ui.renderOccasion, karunya: T.ui.renderKarunya,
    script: T.ui.renderPreview, recital: T.ui.renderRecital, abhivadaye: T.ui.renderAbhivadaye,
    print: T.ui.renderPrint
  };

  function currentSection() {
    var h = (window.location.hash || "#profile").replace("#", "");
    return SECTIONS.indexOf(h) !== -1 ? h : "profile";
  }

  function applyTheme(theme) {
    var root = document.documentElement;
    if (theme === "dark") root.setAttribute("data-theme", "dark");
    else if (theme === "light") root.setAttribute("data-theme", "light");
    else root.removeAttribute("data-theme");
  }

  function updateNavActive(section) {
    var inBar = false;
    document.querySelectorAll(".side-nav a, .tab-bar a, .more-sheet a").forEach(function (a) {
      var on = a.getAttribute("href") === "#" + section;
      a.classList.toggle("active", on);
      if (on && a.parentNode.id === "tab-bar") inBar = true;
    });
    // Sections without their own tab (karunya, abhivadaye, print) light up "More".
    document.getElementById("tab-more").classList.toggle("active", !inBar);
  }

  // Phone "More" sheet: every section, so nothing is out of reach on a small screen.
  function setMoreOpen(open) {
    document.getElementById("more-sheet").classList.toggle("hidden", !open);
    document.getElementById("tab-more").setAttribute("aria-expanded", String(open));
  }

  // Static shell text (nav, tab bar, labels) lives in index.html; re-translate it on every
  // render so a language switch updates the whole page in place.
  function applyStaticI18n() {
    var lang = T.i18n.lang;
    document.documentElement.lang = lang;
    document.title = T.ui.t("app.title");
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = T.ui.t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
      el.setAttribute("aria-label", T.ui.t(el.getAttribute("data-i18n-aria")));
    });
  }

  function renderTopbar() {
    var ui = T.store.get().ui;
    applyStaticI18n();
    document.getElementById("app-title").textContent = T.ui.t("app.title");
    var occSel = document.getElementById("occasion-chip");
    occSel.innerHTML = ["amavasya", "mahalaya", "mahalaya_amavasya"].map(function (k) {
      return '<option value="' + k + '"' + (k === ui.occasion ? " selected" : "") + ">" + T.ui.esc(T.ui.t("occasion." + k)) + "</option>";
    }).join("");
    document.getElementById("date-chip").value = ui.datetime || "";
    document.getElementById("lang-picker").value = ui.lang || "en";
    document.getElementById("script-picker").value = ui.script || "iast";
  }

  var lastSection = null;
  function render() {
    var section = currentSection();
    updateNavActive(section);
    if (section !== "recital") T.ui.recitalStop && T.ui.recitalStop();
    if (section !== lastSection) { window.scrollTo(0, 0); lastSection = section; }
    var main = document.getElementById("main");
    var fn = RENDERERS[section];
    if (fn) fn(main, {});

    // Live preview split-pane (desktop only; CSS hides it on narrow screens).
    var live = document.getElementById("live-preview");
    if (section !== "script" && section !== "recital" && section !== "print" && T.store.get().profile) {
      live.innerHTML = "<h3>" + T.ui.t("nav.script") + "</h3>";
      var wrap = document.createElement("div");
      live.appendChild(wrap);
      try { T.ui.renderPreview(wrap, { compact: true }); } catch (e) { wrap.innerHTML = "<p>—</p>"; }
    } else {
      live.innerHTML = "";
    }
    renderTopbar();
  }

  function wireTopbar() {
    document.getElementById("tab-more").addEventListener("click", function () {
      setMoreOpen(document.getElementById("more-sheet").classList.contains("hidden"));
    });
    document.getElementById("more-sheet").addEventListener("click", function () { setMoreOpen(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") setMoreOpen(false); });
    document.getElementById("occasion-chip").addEventListener("change", function (e) {
      T.store.setUI({ occasion: e.target.value });
    });
    document.getElementById("date-chip").addEventListener("change", function (e) {
      if (e.target.value) T.ui.recomputePanchang({ useNow: false, datetime: e.target.value });
    });
    document.getElementById("lang-picker").addEventListener("change", function (e) {
      T.i18n.setLang(e.target.value);
      T.store.setUI({ lang: e.target.value });
    });
    document.getElementById("script-picker").addEventListener("change", function (e) {
      T.store.setUI({ script: e.target.value });
    });
    document.getElementById("theme-toggle").addEventListener("click", function () {
      var cur = T.store.get().ui.theme || "auto";
      var next = cur === "dark" ? "light" : (cur === "light" ? "auto" : "dark");
      applyTheme(next);
      T.store.setUI({ theme: next });
    });
  }

  function init() {
    T.store.load();
    var s = T.store.get();
    if (!s.profile) T.store.setProfile(JSON.parse(JSON.stringify(T.data.emptyProfile)));
    // "Use current time" (the default) refreshes the moment and panchang on every visit.
    T.ui.recomputePanchang();
    T.i18n.setLang(s.ui.lang || "en");
    applyTheme(s.ui.theme || "auto");

    wireTopbar();
    T.store.subscribe(render);
    window.addEventListener("hashchange", render);
    if (!window.location.hash) window.location.hash = "#profile";
    render();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})(window.Thar);

</script>
