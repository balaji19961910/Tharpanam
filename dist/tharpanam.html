<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tharpanam Helper</title>
<style>
/* css/app.css — design tokens, light/dark theming, layout, print stylesheet. */
:root {
  --color-bg: #faf6ef;
  --color-bg-alt: #f2ead9;
  --color-surface: #ffffff;
  --color-border: #e4d9c4;
  --color-text: #2b2419;
  --color-text-muted: #6c6152;
  --color-accent: #d97706;      /* turmeric/saffron */
  --color-accent-strong: #b45309;
  --color-accent-bg: #fef3c7;
  --color-danger: #b91c1c;
  --color-danger-bg: #fee2e2;
  --color-warn: #92400e;
  --color-warn-bg: #fef3c7;
  --color-ok: #166534;

  --poonal-upaveeti: #16a34a;
  --poonal-upaveeti-bg: #dcfce7;
  --poonal-pracheenaveeti: #ea580c;
  --poonal-pracheenaveeti-bg: #ffedd5;
  --poonal-niveeti: #2563eb;
  --poonal-niveeti-bg: #dbeafe;

  --radius: 12px;
  --shadow: 0 1px 3px rgba(43, 36, 25, 0.12), 0 1px 2px rgba(43, 36, 25, 0.08);
  --font-body: "Noto Sans", "Noto Sans Tamil", "Noto Sans Devanagari", -apple-system,
    "Segoe UI", system-ui, sans-serif;
  --font-mantra: "Noto Serif", "Noto Sans Tamil", "Noto Sans Devanagari", Georgia, serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg: #1c1712;
    --color-bg-alt: #241d16;
    --color-surface: #2a2219;
    --color-border: #43392a;
    --color-text: #f1e9da;
    --color-text-muted: #baa989;
    --color-accent: #f0a83a;
    --color-accent-strong: #f7c873;
    --color-accent-bg: #4a3312;
    --color-danger: #f87171;
    --color-danger-bg: #4c1d1d;
    --color-warn: #fbbf24;
    --color-warn-bg: #453210;
    --color-ok: #4ade80;
    --poonal-upaveeti-bg: #123420;
    --poonal-pracheenaveeti-bg: #482008;
    --poonal-niveeti-bg: #102a4c;
  }
}
:root[data-theme="dark"] {
  --color-bg: #1c1712;
  --color-bg-alt: #241d16;
  --color-surface: #2a2219;
  --color-border: #43392a;
  --color-text: #f1e9da;
  --color-text-muted: #baa989;
  --color-accent: #f0a83a;
  --color-accent-strong: #f7c873;
  --color-accent-bg: #4a3312;
  --color-danger: #f87171;
  --color-danger-bg: #4c1d1d;
  --color-warn: #fbbf24;
  --color-warn-bg: #453210;
  --color-ok: #4ade80;
  --poonal-upaveeti-bg: #123420;
  --poonal-pracheenaveeti-bg: #482008;
  --poonal-niveeti-bg: #102a4c;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.55;
}
a { color: var(--color-accent-strong); }
button, select, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.25; }
.hidden { display: none !important; }

#app {
  display: grid;
  grid-template-columns: 220px 1fr 340px;
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "topbar topbar topbar"
    "nav main preview";
  min-height: 100vh;
}
.topbar {
  grid-area: topbar;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px;
  padding: 10px 16px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  position: sticky; top: 0; z-index: 20;
}
.topbar-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; }
.brand-mark { color: var(--color-accent); }
.topbar-controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip-select {
  border: 1px solid var(--color-border); border-radius: 999px; padding: 6px 10px;
  background: var(--color-bg-alt); color: var(--color-text); font-size: 14px;
}
.icon-btn {
  border: 1px solid var(--color-border); border-radius: 999px; background: var(--color-bg-alt);
  width: 36px; height: 36px; cursor: pointer; color: var(--color-text);
}

.side-nav {
  grid-area: nav;
  display: flex; flex-direction: column; gap: 2px;
  padding: 16px 10px; border-right: 1px solid var(--color-border);
  position: sticky; top: 57px; align-self: start; height: calc(100vh - 57px);
}
.side-nav a {
  display: block; padding: 10px 12px; border-radius: 8px; text-decoration: none;
  color: var(--color-text); font-size: 15px;
}
.side-nav a.active, .side-nav a:hover { background: var(--color-accent-bg); color: var(--color-accent-strong); }

.main-area { grid-area: main; padding: 20px; min-width: 0; }
.live-preview { grid-area: preview; padding: 20px; border-left: 1px solid var(--color-border);
  overflow-y: auto; max-height: calc(100vh - 57px); position: sticky; top: 57px; }

.tab-bar { display: none; }

.card {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.card h2 { margin-top: 0; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 14px; color: var(--color-text-muted); margin-bottom: 4px; }
.field input[type="text"], .field input[type="date"], .field select, .field textarea {
  width: 100%; padding: 9px 10px; border: 1px solid var(--color-border); border-radius: 8px;
  background: var(--color-bg-alt); color: var(--color-text);
}
.field-row { display: flex; gap: 10px; flex-wrap: wrap; }
.field-row > .field { flex: 1 1 160px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--color-accent);
  background: var(--color-accent); color: #2b1a00; font-weight: 600; border-radius: 8px;
  padding: 9px 14px; cursor: pointer;
}
.btn.secondary { background: transparent; color: var(--color-accent-strong); }
.btn.danger { background: transparent; border-color: var(--color-danger); color: var(--color-danger); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.lineage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.person-card { border: 1px solid var(--color-border); border-radius: 10px; padding: 10px; background: var(--color-bg-alt); }
.person-card.skipped { opacity: 0.55; }
.person-card.unused { opacity: 0.7; border-style: dashed; }
.person-card input[type="text"], .person-card select { width: 100%; }
.check { font-size: 14px; display: flex; gap: 6px; align-items: center; margin-bottom: 4px; cursor: pointer; }

.slot-badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; margin-bottom: 8px; }
.slot-badge.used { background: var(--poonal-pracheenaveeti-bg); color: var(--color-accent-strong); }
.slot-badge.living { background: var(--color-bg); color: var(--color-text-muted); border: 1px solid var(--color-border); }
.slot-badge.unused { background: transparent; color: var(--color-text-muted); border: 1px dashed var(--color-border); }

.chain-row { margin-bottom: 18px; }
.chain-row h4 { margin: 8px 0; font-size: 15px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.older-gens { margin-top: 10px; }
.older-gens > summary { cursor: pointer; color: var(--color-accent-strong); font-size: 15px; padding: 4px 0; }
.older-gens[open] > summary { margin-bottom: 10px; }

.hint { font-size: 14px; color: var(--color-text-muted); margin: 6px 0 0; }
.warn-note { font-size: 14px; color: var(--color-warn); background: var(--color-warn-bg); padding: 6px 10px; border-radius: 8px; margin: 8px 0 0; }
.collapsed-note { padding: 12px; border: 1px dashed var(--color-border); border-radius: 10px; }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--color-border); border-radius: 999px; padding: 3px; background: var(--color-bg-alt); gap: 2px; }
.seg-btn { border: 0; background: transparent; color: var(--color-text); font: inherit; font-size: 15px; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg-btn.active { background: var(--color-accent); color: #2b1a00; font-weight: 600; }
.seg-btn:focus-visible { outline: 2px solid var(--color-accent-strong); outline-offset: 2px; }

.pravara-editor .seg { margin-bottom: 10px; }
.rishi-list { margin: 0 0 8px; padding-left: 24px; display: grid; gap: 6px; }
.rishi-list li { display: flex; gap: 6px; align-items: center; }
.rishi-list input { flex: 1; min-width: 0; }
.pravara-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.small { padding: 4px 12px; font-size: 14px; }
.icon-btn.small { width: 32px; height: 32px; font-size: 14px; flex: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn-row label.btn { cursor: pointer; }
.person-card .rel-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.person-card .shift-note { font-size: 12px; color: var(--color-accent-strong); margin-top: 6px; }
.chip-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--color-accent-bg); color: var(--color-accent-strong); margin-left: 6px; }

.validation-panel { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
.validation-panel.blocks { background: var(--color-danger-bg); border: 1px solid var(--color-danger); }
.validation-panel.ok { background: var(--color-ok-bg, transparent); border: 1px solid var(--color-border); }
.validation-item { margin: 6px 0; font-size: 15px; }
.validation-item.warning { color: var(--color-warn); }
.validation-item.block { color: var(--color-danger); font-weight: 600; }
.verify-notice { font-size: 13px; color: var(--color-text-muted); margin-top: 10px; }

.step-card { border: 1px solid var(--color-border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; background: var(--color-surface); }
.step-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.step-title { font-weight: 700; font-size: 16px; }
.step-num { color: var(--color-text-muted); font-size: 13px; }
.poonal-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
.poonal-badge.upaveeti { background: var(--poonal-upaveeti-bg); color: var(--poonal-upaveeti); }
.poonal-badge.pracheenaveeti { background: var(--poonal-pracheenaveeti-bg); color: var(--poonal-pracheenaveeti); }
.poonal-badge.niveeti { background: var(--poonal-niveeti-bg); color: var(--poonal-niveeti); }
.koorcham-tag { font-size: 12px; color: var(--color-text-muted); border: 1px solid var(--color-border); border-radius: 999px; padding: 2px 8px; }
.step-instruction { font-size: 14px; color: var(--color-text-muted); margin-bottom: 8px; }
.mantra-block { font-family: var(--font-mantra); font-size: 19px; white-space: pre-wrap; line-height: 1.7; }
.mantra-line { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--color-border); }
.mantra-line:last-child { border-bottom: none; }
.mantra-text { flex: 1; outline: none; }
.mantra-text:focus { background: var(--color-accent-bg); border-radius: 6px; }
.tap-counter { flex: 0 0 auto; border: 1px solid var(--color-border); border-radius: 999px; padding: 4px 10px; background: var(--color-bg-alt); cursor: pointer; font-variant-numeric: tabular-nums; min-width: 54px; text-align: center; }
.tap-counter.complete { background: var(--poonal-upaveeti-bg); color: var(--poonal-upaveeti); border-color: var(--poonal-upaveeti); }
.edit-reset { font-size: 12px; margin-left: 8px; cursor: pointer; color: var(--color-accent-strong); }
.poonal-change-banner { text-align: center; font-weight: 800; font-size: 15px; padding: 10px; border-radius: var(--radius); margin: 14px 0; letter-spacing: 0.02em; }
.poonal-change-banner.upaveeti { background: var(--poonal-upaveeti-bg); color: var(--poonal-upaveeti); border: 2px solid var(--poonal-upaveeti); }
.poonal-change-banner.pracheenaveeti { background: var(--poonal-pracheenaveeti-bg); color: var(--poonal-pracheenaveeti); border: 2px solid var(--poonal-pracheenaveeti); }
.poonal-change-banner.niveeti { background: var(--poonal-niveeti-bg); color: var(--poonal-niveeti); border: 2px solid var(--poonal-niveeti); }
.pass-divider { text-align: center; font-weight: 700; color: var(--color-text-muted); margin: 22px 0 10px; text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px; }

.checklist { list-style: none; padding: 0; }
.checklist li { padding: 6px 0; border-bottom: 1px solid var(--color-border); }

.karunya-list { display: flex; flex-direction: column; gap: 10px; }
.karunya-item { border: 1px solid var(--color-border); border-radius: 10px; padding: 10px; background: var(--color-bg-alt); }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.chip { border: 1px solid var(--color-border); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; background: var(--color-surface); }

.abhivadaye-card { text-align: center; padding: 30px 16px; }
.abhivadaye-text { font-family: var(--font-mantra); font-size: 24px; white-space: pre-wrap; line-height: 1.7; }

/* ---- Recital mode ---- */
.recital-overlay {
  position: fixed; inset: 0; background: var(--color-bg); z-index: 100;
  display: flex; flex-direction: column; padding: 20px;
}
.recital-poonal { align-self: center; font-size: 20px; padding: 10px 20px; border-radius: 999px; margin-bottom: 14px; }
.recital-body { flex: 1; overflow-y: auto; font-size: 28px; line-height: 1.8; font-family: var(--font-mantra); display: flex; flex-direction: column; }
/* Centre short steps without clipping the top of long ones (justify-content:center would). */
.recital-body > :first-child { margin-top: auto; }
.recital-body > :last-child { margin-bottom: auto; }
.recital-title { font-size: 22px; font-weight: 700; font-family: var(--font-body); margin-bottom: 10px; text-align: center; }
.recital-instruction { font-size: 18px; font-family: var(--font-body); color: var(--color-text-muted); text-align: center; margin-bottom: 16px; }
.recital-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
.recital-interstitial { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 20px; text-align: center; }

/* ---- Responsive ---- */
@media (max-width: 1100px) {
  #app { grid-template-columns: 200px 1fr; grid-template-areas: "topbar topbar" "nav main"; }
  .live-preview { display: none; }
}
@media (max-width: 760px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "topbar" "main"; padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  .side-nav { display: none; }
  /* The top bar scrolls away on phones so the form gets the whole screen. */
  .topbar { position: static; padding: 8px 12px; }
  .topbar-brand { font-size: 17px; }
  .topbar-controls { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; width: 100%; }
  .topbar-controls #occasion-chip, .topbar-controls #date-chip { grid-column: 1 / -1; width: 100%; }
  .topbar-controls .chip-select { min-width: 0; font-size: 15px; padding: 8px 10px; }
  .main-area { padding: 12px; }
  .card { padding: 12px; }
  .card h2 { font-size: 21px; }
  .step-card { padding: 12px; }
  .mantra-block { font-size: 18px; }
  .mantra-line { flex-wrap: wrap; }
  .tap-counter { min-width: 64px; padding: 8px 12px; margin-left: auto; }
  .seg-btn { padding: 8px 12px; }
  .btn { padding: 10px 14px; }
  .field input[type="text"], .field select, .field textarea, .field input[type="datetime-local"] { font-size: 16px; padding: 10px; }
  .lineage-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .person-card { padding: 8px; }
  .person-card .check { font-size: 13px; }
  .panchang-summary { grid-template-columns: 1fr 1fr; }
  .panchang-summary .v { font-size: 17px; }
  .planner { font-size: 14px; }
  .tab-bar {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: var(--color-surface); border-top: 1px solid var(--color-border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab-bar a, .tab-bar button {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 7px 2px 8px; text-decoration: none; color: var(--color-text); font-size: 12px; line-height: 1.2;
    background: none; border: 0; cursor: pointer; font-family: inherit;
  }
  .tab-bar a > span:last-child, .tab-bar button > span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-ic { font-size: 19px; line-height: 1.1; }
  .tab-bar .active { color: var(--color-accent-strong); font-weight: 700; }
  .more-sheet { position: fixed; inset: 0; z-index: 29; background: rgba(0, 0, 0, 0.35); display: flex; align-items: flex-end; }
  .more-sheet-panel {
    width: 100%; background: var(--color-surface); border-radius: 16px 16px 0 0; padding: 8px 8px calc(72px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.18);
  }
  .more-sheet-panel a { display: block; padding: 13px 14px; border-radius: 10px; color: var(--color-text); text-decoration: none; font-size: 17px; }
  .more-sheet-panel a.active { background: var(--color-accent-bg); color: var(--color-accent-strong); font-weight: 700; }
  .recital-overlay { padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
  .recital-body { font-size: 23px; }
  .recital-title { font-size: 19px; }
  .recital-nav .btn { flex: 1; justify-content: center; }
}
@media (max-width: 380px) { .lineage-grid { grid-template-columns: 1fr; } }
@media (min-width: 761px) { .more-sheet { display: none !important; } }

/* Step how-to: chips, numbered physical instructions, "Say" label */
.step-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.step-chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--color-bg-alt); border: 1px solid var(--color-border); color: var(--color-text); }
.do-block { margin: 6px 0 10px; border-left: 3px solid var(--color-accent); padding-left: 12px; }
.do-block > summary { cursor: pointer; font-weight: 600; font-size: 15px; color: var(--color-accent-strong); padding: 2px 0; }
.do-list { margin: 6px 0 0; padding-left: 22px; font-size: 16px; line-height: 1.55; }
.do-list li { margin-bottom: 4px; }
.say-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-muted); margin: 8px 0 2px; }
.recital-body .step-chips { justify-content: center; }
.recital-body .do-block { max-width: 760px; margin: 0 auto 18px; text-align: left; }
.recital-body .do-list { font-size: 18px; }

/* Occasion: computed panchang summary */
.panchang-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 4px 0 10px; }
.panchang-summary > div { background: var(--color-accent-bg); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; }
.panchang-summary .k { font-size: 13px; color: var(--color-text-muted); }
.panchang-summary .v { font-size: 20px; font-weight: 700; }
.panchang-mode { margin: 6px 0 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip-badge.manual { background: var(--color-warn-bg); color: var(--color-warn); }
.field input[type="datetime-local"] { width: 100%; padding: 9px 10px; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-bg-alt); color: var(--color-text); }

.style-preview { font-family: var(--font-mantra); font-size: 17px; margin: 4px 0 0; padding-left: 22px; }
.field textarea { font-family: var(--font-mantra); font-size: 16px; }
code { font-size: 13px; background: var(--color-bg-alt); border: 1px solid var(--color-border); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
.table-wrap { overflow-x: auto; }
.planner { width: 100%; border-collapse: collapse; font-size: 15px; }
.planner th, .planner td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--color-border); vertical-align: top; }
.planner th { font-size: 13px; color: var(--color-text-muted); font-weight: 600; }
.planner tbody tr { cursor: pointer; }
.planner tbody tr:hover { background: var(--color-bg-alt); }
.planner tr.current { background: var(--color-accent-bg); }
.planner .chip-badge { margin: 0 4px 2px 0; }
.step-add { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.step-card.custom-step { border-style: dashed; border-color: var(--color-accent); }
.extra-lines { border-left: 3px dashed var(--color-accent); padding-left: 10px; margin-top: 6px; }
.extra-lines .mantra-line { display: flex; gap: 6px; align-items: flex-start; }
.extra-lines .mantra-text { flex: 1; min-height: 1.6em; }
.extra-lines .mantra-text:empty::before { content: "…"; color: var(--color-text-muted); }

/* ---- Print booklet (js/ui/print.js) ----
   On screen the booklet is shown as a sheet of paper so the preview matches the printout. */
#print-root { display: none; }
.print-stage { overflow-x: auto; padding: 4px 0 24px; }
.print-checks { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-bottom: 8px; }
.print-sheet {
  --p-ink: #1d1a16; --p-muted: #5d5548; --p-rule: #cfc6b5; --p-base: 15px;
  background: #fff; color: var(--p-ink); margin: 0 auto; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
  font-family: var(--font-body); font-size: var(--p-base); line-height: 1.5;
}
.print-sheet.paper-a5 { width: 148mm; padding: 10mm 10mm; }
.print-sheet.paper-a4 { width: 210mm; padding: 12mm 13mm; }
.print-sheet.size-s { --p-base: 13px; }
.print-sheet.size-l { --p-base: 18px; }
.p-header { text-align: center; border-bottom: 2px solid var(--p-ink); padding-bottom: 0.8em; margin-bottom: 1em; }
.p-om { font-size: 2em; line-height: 1; color: #b45309; }
.p-occasion { font-size: 1.55em; margin: 0.15em 0 0.1em; }
.p-date { margin: 0; color: var(--p-muted); }
.p-panchang { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.3em 0.8em; margin: 0.7em 0 0.5em; text-align: left; }
.p-panchang div { border-left: 3px solid #d97706; padding-left: 0.5em; }
.p-panchang dt { font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.05em; color: var(--p-muted); }
.p-panchang dd { margin: 0; font-family: var(--font-mantra); font-weight: 600; }
.p-kartha { margin: 0.4em 0; }
.p-legend { margin: 0.5em 0 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4em; }
.p-poonal { display: inline-block; font-size: 0.74em; font-weight: 700; padding: 0.1em 0.6em; border-radius: 999px; border: 1.5px solid; white-space: nowrap; }
.p-poonal.upaveeti { color: #15803d; background: #dcfce7; }
.p-poonal.pracheenaveeti { color: #c2410c; background: #ffedd5; }
.p-poonal.niveeti { color: #1d4ed8; background: #dbeafe; }
.p-pass { font-size: 0.95em; text-transform: uppercase; letter-spacing: 0.08em; text-align: center; border-top: 1px solid var(--p-ink); border-bottom: 1px solid var(--p-ink); padding: 0.3em 0; margin: 1.2em 0 0.8em; }
.p-step { padding: 0.55em 0 0.7em; border-bottom: 1px solid var(--p-rule); }
.p-step-head { display: flex; align-items: baseline; gap: 0.5em; flex-wrap: wrap; break-after: avoid; }
.p-num { flex: none; font-weight: 700; min-width: 1.6em; height: 1.6em; line-height: 1.6em; text-align: center; border-radius: 50%; background: #f2ead9; font-size: 0.85em; }
.p-title { font-size: 1.08em; margin: 0; flex: 1 1 auto; }
.p-notes { margin: 0.2em 0 0; font-size: 0.82em; color: var(--p-muted); font-style: italic; }
.p-instr { margin: 0.25em 0 0; font-size: 0.9em; color: var(--p-muted); }
.p-howto { margin: 0.3em 0 0; padding-left: 1.5em; font-size: 0.86em; color: #3b352c; }
.p-howto li { margin: 0.05em 0; }
.p-materials { columns: 2; margin: 0.3em 0 0; padding-left: 1.3em; font-size: 0.92em; }
.p-lines { margin-top: 0.4em; }
.p-text { font-family: var(--font-mantra); font-size: 1.14em; line-height: 1.65; margin: 0.15em 0; white-space: pre-wrap; }
.p-tarpana { padding-left: 1.6em; margin: 0.4em 0 0; }
.p-tarpana li { display: flex; align-items: baseline; gap: 0.6em; break-inside: avoid; border-bottom: 1px dotted var(--p-rule); padding: 0.1em 0; }
.p-tarpana li::marker { font-size: 0.8em; color: var(--p-muted); }
.p-tarpana .p-text { flex: 1; margin: 0; }
.p-count { flex: none; font-size: 0.78em; color: var(--p-muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 0.2em; }
.p-box { display: inline-block; width: 0.85em; height: 0.85em; border: 1.2px solid var(--p-ink); border-radius: 2px; }
.p-change { margin: 0.7em 0; padding: 0.45em 0.8em; font-weight: 800; text-align: center; border: 2px solid; border-radius: 8px; break-after: avoid; }
.p-change.upaveeti { color: #15803d; background: #f0fdf4; }
.p-change.pracheenaveeti { color: #c2410c; background: #fff7ed; }
.p-change.niveeti { color: #1d4ed8; background: #eff6ff; }
.p-abhivadaye { text-align: center; border: 1.5px solid var(--p-ink); border-radius: 8px; padding: 0.8em; margin-top: 1em; }
.p-blocked { font-weight: 700; color: #b91c1c; }
.p-footer { margin-top: 1.2em; text-align: center; font-size: 0.75em; color: var(--p-muted); }
/* Compact (default): tight, sheet-like spacing, like a vadhyar's printed sheet. */
.print-sheet.compact { line-height: 1.35; }
.print-sheet.compact.size-m { --p-base: 13.5px; }
.print-sheet.compact.size-s { --p-base: 12px; }
.print-sheet.compact.size-l { --p-base: 16px; }
.compact .p-header { padding-bottom: 0.4em; margin-bottom: 0.4em; border-bottom-width: 1.5px; }
.compact .p-om { font-size: 1.5em; }
.compact .p-occasion { font-size: 1.3em; margin: 0; }
.compact .p-date { font-size: 0.9em; }
.compact .p-panchang { grid-template-columns: repeat(6, 1fr); margin: 0.35em 0 0.25em; gap: 0.15em 0.6em; }
.compact.paper-a5 .p-panchang { grid-template-columns: repeat(3, 1fr); }
.compact .p-panchang dt { font-size: 0.66em; }
.compact .p-kartha { margin: 0.2em 0; font-size: 0.92em; }
.compact .p-legend { margin-top: 0.2em; gap: 0.3em; }
.compact .p-poonal { font-size: 0.68em; padding: 0 0.5em; border-width: 1px; }
.compact .p-pass { margin: 0.6em 0 0.3em; padding: 0.15em 0; font-size: 0.85em; }
.compact .p-step { padding: 0.3em 0 0.35em; border-bottom-color: #e5dfd3; }
.compact .p-num { min-width: 1.45em; height: 1.45em; line-height: 1.45em; font-size: 0.78em; }
.compact .p-title { font-size: 1em; }
.compact .p-notes, .compact .p-instr { margin: 0; font-size: 0.78em; }
.compact .p-howto { margin: 0.1em 0 0; padding: 0; font-size: 0.78em; line-height: 1.35; color: #4a443a; }
.compact .p-howto b { color: #b45309; }
.compact .p-materials { margin: 0.1em 0 0; font-size: 0.84em; columns: 3; }
.compact .p-lines { margin-top: 0.2em; }
.compact .p-text { font-size: 1.06em; line-height: 1.4; margin: 0; }
.compact .p-tarpana { margin-top: 0.15em; padding-left: 1.4em; }
.compact .p-tarpana li { padding: 0.02em 0; }
.compact .p-change { margin: 0.35em 0; padding: 0.15em 0.6em; font-size: 0.85em; border-width: 1.5px; border-radius: 6px; }
.compact .p-abhivadaye { padding: 0.4em; margin-top: 0.6em; }
.compact .p-footer { margin-top: 0.6em; }

@media (max-width: 760px) {
  /* Fit the paper preview to a phone screen instead of forcing a sideways scroll. */
  .print-sheet.paper-a5, .print-sheet.paper-a4 { width: 100%; padding: 16px 14px; }
}

@media print {
  body { background: #fff !important; color: #000; }
  #app { display: none !important; }
  #print-root { display: block; }
  .print-sheet { box-shadow: none; width: auto !important; padding: 0 !important; margin: 0; }
  /* Long steps may run across pages; keep each heading with its first lines and never split a line. */
  .p-change, .p-abhivadaye, .p-header, .p-panchang { break-inside: avoid; }
  .p-step-head, .p-notes, .p-instr, .p-pass { break-after: avoid; }
  .p-text, .p-tarpana li, .p-howto li { break-inside: avoid; }
  .p-step { orphans: 3; widows: 3; }
  .p-poonal, .p-change, .p-om, .p-num, .p-panchang div { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>

<script>
/* ---- data/relations.js ---- */

    { key: "jyeshtha_pitrvya_patni", labelKey: "relation.jyeshtha_pitrvya_patni", sanskrit: "jyeṣṭha pitṛvya patnī", gender: "F", defaultGotraRule: "own" },
    { key: "kanishtha_pitrvya_patni", labelKey: "relation.kanishtha_pitrvya_patni", sanskrit: "kaniṣṭha pitṛvya patnī", gender: "F", defaultGotraRule: "own" },
    { key: "jyeshtha_bhratr",    labelKey: "relation.jyeshtha_bhratr",    sanskrit: "jyeṣṭha bhrātṛ",    gender: "M", defaultGotraRule: "own" },
    { key: "kanishtha_bhratr",   labelKey: "relation.kanishtha_bhratr",   sanskrit: "kaniṣṭha bhrātṛ",   gender: "M", defaultGotraRule: "own" },

    { key: "matula",             labelKey: "relation.matula",             sanskrit: "mātula",            gender: "M", defaultGotraRule: "motherBirth" },

    "chip.facing.east": "Face east",
    "chip.facing.south": "Face south",
    "chip.theertham.brahma": "Brahma theertham (sip from the base of the palm)",

    "step.do_title": "What to do",
    "step.mantra_title": "Say",
    "step.materials.do": "Bathe first and wear a panchakacham dhoti and angavastram. Do not eat until the tharpanam is over.\nMake the pavitram (a ring of 2–3 darbha blades) and the koorchams (darbha tied in a knot, tips forming a loop) beforehand, or keep them ready.\nSit on a low seat with the plate in front of you, the chombu of water and a cup of ellu on your right.\nKeep a panchapatram with water and the uddharani for achamanam.",
    "step.achamanam_1.do": "Sit facing east, poonal in the normal position (left shoulder).\nHold the right palm cupped like a cow's ear (gokarna): index finger folded in, thumb and little finger held apart.\nTake with the uddharani only as much water as wets the throat, and sip it from the base of the palm three times, saying Acyutāya, Anantāya, Govindāya namaḥ.\nKeśava, Nārāyaṇa: touch the right cheek, then the left cheek, with the right thumb.\nMādhava, Govinda: touch the right eye, then the left eye, with the ring finger.\nViṣṇu, Madhusūdana: touch the right nostril, then the left, with the index finger.\nTrivikrama, Vāmana: touch the right ear, then the left, with the little finger.\nŚrīdhara, Hṛṣīkeśa: touch the right shoulder, then the left, with the middle finger.\nPadmanābha: touch the navel with all fingers. Dāmodara: touch the crown of the head with all fingers.",
    "step.pavitram_dharanam.do": "Wash the hands.\nWear the pavitram on the right ring finger while reciting the mantra.\nPut the kattai darbha under your feet.\nTouch water and wash the hand, then hold a few kattai darbha folded together with the pavitram.",
    "step.ganapati_dhyanam.do": "Make loose fists with both hands.\nGently tap your temples with the knuckles (about five times) while reciting.\nThen join the palms briefly in namaskaram.",
    "step.pranayamam.do": "Sit upright and rest the left hand on your lap.\nRight hand: fold the index and middle fingers into the palm. The thumb closes the right nostril; the ring and little fingers close the left nostril.\nBreathe in through the left nostril (thumb closing the right).\nClose both nostrils and recite the whole mantra softly or mentally while holding the breath.\nBreathe out slowly through the right nostril (ring and little fingers closing the left).\nAt the end, touch the right ear with the right fingers. Many families do this three times.",
    "step.sankalpam_deva_part.do": "Place the right palm over the left palm and rest both on the right thigh, holding the darbha.\nRecite the time and place clearly. Keep the hands in the same position; the sankalpam continues in the next step.",
    "step.sankalpam_pitru_part.do": "Change the poonal to the right shoulder (pracheenaveeti).\nKeep the palms together on the right thigh, as before.\nRecite the gotras and names slowly. This is the part that must be exact.\nAt “kariṣye”, touch water (or let a little water with ellu fall onto the plate), as your family does.",
    "step.darbha_nirasanam.do": "Drop only the kattai darbha held with the pavitram (keep the pavitram on).\nChange the poonal to the normal position, touch water and wipe the hand.\nThen change the poonal back to the right shoulder.",
    "step.koorcha_sthapanam.do": "Change the poonal to the right shoulder.\nPlace the koorcham(s) in the middle of the plate with the tip pointing south.\nWith the hand turned over, put a little ellu on the tip of each koorcham while reciting the avahana mantra.",
    "step.avahanam_pitru.do": "Take a pinch of ellu between the thumb, middle and ring fingers of the right hand.\nRecite the mantra looking at the first koorcham, thinking of each ancestor as their name is said.\nAt “āvāhayāmi”, place the ellu on the first koorcham.",
    "step.avahanam_matamaha.do": "Take a fresh pinch of ellu.\nRecite looking at the second koorcham (mother's side).\nAt “āvāhayāmi”, place the ellu on it.",
    "step.avahanam_karunya.do": "Take a fresh pinch of ellu.\nRecite looking at the karunya koorcham.\nAt “āvāhayāmi”, place the ellu on it.",
    "step.asanam.do": "Place a few darbha blades on each koorcham as a seat for the invoked pitrus while reciting.",
    "step.aradhanam.do": "Sprinkle ellu over all the koorchams while reciting.\nThis stands for all the offerings (flowers, sandal, etc.) of a full shraddham.",
    "step.tarpanam_pitru.do": "Hold the chombu in the left hand. Put a pinch of ellu in the right palm.\nTilt the right hand so the water runs off between the thumb and index finger (pitru theertham).\nSay one line. At “tarpayāmi”, pour water with ellu onto the first koorcham.\nRepeat each line the number of times shown (tap the counter). Add ellu whenever the palm is empty.",
    "step.tarpanam_matamaha.do": "Same method as the pitru varga: chombu in the left hand, ellu in the right palm.\nPour through pitru theertham onto the second koorcham at each “tarpayāmi”.\nRepeat each line the number of times shown.",
    "step.tarpanam_karunya.do": "Same method: ellu in the right palm, water poured between thumb and index finger.\nPour onto the karunya koorcham, once per repetition shown.",
    "step.pradakshina_namaskaram.do": "Change the poonal to the normal position.\nStand and turn clockwise in place three times while reciting.\nThen prostrate (namaskaram).",
    "step.upasthanam.do": "Change the poonal to the right shoulder.\nStand facing the koorchams with folded hands and recite.",
    "step.abhivadaye.do": "Change the poonal to the normal position.\nStand. Touch the right ear with the right hand and the left ear with the left hand.\nRecite the abhivadaye clearly.\nThen prostrate (namaskaram).",
    "step.udvasanam.do": "Change the poonal to the right shoulder.\nLooking at the koorcham, recite the yathāsthānam line.",
    "step.sarva_tarpanam.do": "Take the koorcham from the plate and untie it.\nHold it between the right thumb and index finger.\nRecite the mantra and pour water over it.",
    "step.pavitram_visarjanam.do": "Change the poonal to the normal position.\nUntie the pavitram (do not pull it off the finger).\nPlace it on the right ear, or drop it to the north-west.",
    "step.achamanam_2.do": "Do achamanam exactly as at the start: three sips with Acyutāya, Anantāya, Govindāya namaḥ, then the Keśava touches.",
    "step.samarpanam.do": "Take a little water in the right palm.\nRecite, and let the water fall onto the plate, offering the whole ritual to the Lord.",
    "step.dakshina.do": "If an acharya officiated, offer betel leaves, fruit and dakshina with a tulasi leaf, and prostrate.",
    "step.after_notes.do": "Pour the water from the plate at the foot of a tree or plant, not into a drain.\nBrahma yajnam and daily pooja may follow.\nEat only after the tharpanam. At night, the kartha and spouse usually have a light meal (tiffin, fruit or milk).",

    "rule.R1.father_alive": "உங்கள் தந்தை உயிருடன் உள்ளார். வழக்கப்படி தந்தை இருக்கும்போது கர்த்தா இந்தத் தர்ப்பணம் செய்யத் தகுதியில்லை.",
    "rule.R2.mother_alive": "தாய் உயிருடன், தந்தை காலமானவர்: பித்ரு வர்க்கப் பெண்கள் இடங்கள் ஒரு தலைமுறை மேலே நகரும் (பாட்டி, கொள்ளுப் பாட்டி, எள்ளுப் பாட்டி).",

    "rule.R4.short_chain.pitru_male": "பித்ரு வர்க்கம் (ஆண்கள்): காலமான முன்னோர் 3 பேருக்குக் குறைவு. மூத்த தலைமுறைகளைச் சேர்க்கவும்.",
    "rule.R4.short_chain.pitru_female": "பித்ரு வர்க்கம் (பெண்கள்): காலமான முன்னோர் 3 பேருக்குக் குறைவு. மூத்த தலைமுறைகளைச் சேர்க்கவும்.",
    "rule.R4.short_chain.matamaha_male": "மாதாமஹ வர்க்கம் (ஆண்கள்): காலமான முன்னோர் 3 பேருக்குக் குறைவு. மூத்த தலைமுறைகளைச் சேர்க்கவும்.",
    "rule.R4.short_chain.matamaha_female": "மாதாமஹ வர்க்கம் (பெண்கள்): காலமான முன்னோர் 3 பேருக்குக் குறைவு. மூத்த தலைமுறைகளைச் சேர்க்கவும்.",
    "rule.R5.name_unknown": "ஒரு பெயர் தெரியவில்லை; \"tat tat śarmaṇaḥ / nāmnīḥ\" என்ற இடக்குறி பயன்படுத்தப்படும்.",
    "rule.R6.gotra_unknown": "ஒரு கோத்ரம் தெரியவில்லை; \"tat tat gotrāṇām\" (அல்லது உங்கள் அமைப்பின்படி காஶ்யப) பயன்படுத்தப்படும்.",
    "rule.R9.both_sequences": "மஹாளய அமாவாசை: முதலில் அமாவாசை வரிசை, பிறகு காருண்ய (மஹாளய) வரிசை.",
    "rule.R11.generic_karunya": "காருண்ய உறவினர்கள் பட்டியலிடப்படவில்லை; பொது வரி இருந்தாலும் சொல்லப்படும்.",

    "step.materials.title": "பொருட்கள்",
    "step.materials.how": "தொடங்கும் முன் அனைத்தையும் சேகரித்துக் கொள்ளவும்.",
    "step.achamanam_1.title": "ஆசமனம்",
    "step.achamanam_1.how": "மூன்று முறை நீர் அருந்தி, விஷ்ணு நாமங்களுடன் கற்பித்தபடி அங்கங்களைத் தொடவும்.",
    "step.pavitram_dharanam.title": "பவித்ர தாரணம்",
    "step.pavitram_dharanam.how": "வலது மோதிர விரலில் பவித்ரம் அணியவும். தர்ப்பையின் மேல் அமரவும்.",
    "step.ganapati_dhyanam.title": "கணபதி த்யானம்",
    "step.ganapati_dhyanam.how": "தடையின்றி நடக்க கணபதியை நினைக்கவும் (ஸ்மார்த்த வழக்கம்).",
    "step.pranayamam.title": "ப்ராணாயாமம்",
    "step.pranayamam.how": "வ்யாஹ்ருதிகளும் காயத்ரியும் சொல்லி மூச்சைக் கட்டுப்படுத்தவும்.",
    "step.sankalpam_deva_part.title": "ஸங்கல்பம் — தேவ பாகம்",
    "step.sankalpam_deva_part.how": "இடம், காலம் (தேச-காலம்) மற்றும் தேவ கார்ய நோக்கத்தைச் சொல்லவும்.",
    "step.sankalpam_pitru_part.title": "ஸங்கல்பம் — பித்ரு பாகம்",
    "step.sankalpam_pitru_part.how": "வர்க்கங்களின் கோத்ரங்கள், பெயர்கள் மற்றும் இன்றைய ஶ்ராத்த நோக்கத்தைச் சொல்லவும்.",
    "step.darbha_nirasanam.title": "தர்ப்ப நிரஸனம்",
    "step.darbha_nirasanam.how": "இதுவரை பிடித்த தர்ப்பையை வடமேற்கில் போட்டு, நீரைத் தொடவும்.",
    "step.koorcha_sthapanam.title": "கூர்ச்ச ஸ்தாபனம்",
    "step.koorcha_sthapanam.how": "கூர்ச்சங்களை நுனி வடக்கு, அடி தெற்காக வைத்து, அவற்றின் மேல் எள் தூவவும்.",
    "step.avahanam_pitru.title": "ஆவாஹனம் — பித்ரு வர்க்கம்",
    "step.avahanam_pitru.how": "பித்ரு வர்க்கத்தை முதல் கூர்ச்சத்தில் ஆவாஹனம் செய்யவும்.",
    "step.avahanam_matamaha.title": "ஆவாஹனம் — மாதாமஹ வர்க்கம்",
    "step.avahanam_matamaha.how": "மாதாமஹ வர்க்கத்தை இரண்டாம் கூர்ச்சத்தில் ஆவாஹனம் செய்யவும்.",
    "step.avahanam_karunya.title": "ஆவாஹனம் — காருண்ய பித்ருக்கள்",
    "step.avahanam_karunya.how": "காருண்ய பித்ருக்களை அடுத்த கூர்ச்சத்தில் ஆவாஹனம் செய்யவும்.",
    "step.asanam.title": "ஆஸனம்",
    "step.asanam.how": "ஆவாஹனம் செய்த பித்ருக்களுக்கு தர்ப்பை ஆஸனம் அளிக்கவும்.",
    "step.aradhanam.title": "ஆராதனம்",
    "step.aradhanam.how": "எள் முதலியவற்றால் பித்ருக்களை ஆராதிக்கவும்.",
    "step.tarpanam_pitru.title": "தர்ப்பணம் — பித்ரு வர்க்கம்",
    "step.tarpanam_pitru.how": "பித்ரு வர்க்கத்தின் ஆறு இடங்களுக்கும் எள்ளும் நீரும் அளித்து, பின் ஜ்ஞாதாஜ்ஞாத வரிகள்.",
    "step.tarpanam_matamaha.title": "தர்ப்பணம் — மாதாமஹ வர்க்கம்",
    "step.tarpanam_matamaha.how": "மாதாமஹ வர்க்கத்தின் ஆறு இடங்களுக்கும் எள்ளும் நீரும் அளித்து, பின் ஜ்ஞாதாஜ்ஞாத வரிகள்.",
    "step.tarpanam_karunya.title": "தர்ப்பணம் — காருண்ய பித்ருக்கள்",
    "step.tarpanam_karunya.how": "காலமான ஒவ்வொரு காருண்ய உறவினருக்கும் எள்ளும் நீரும் அளித்து, பின் பொது வரி.",
    "step.pradakshina_namaskaram.title": "ப்ரதக்ஷிண நமஸ்காரம்",
    "step.pradakshina_namaskaram.how": "தேவர்களுக்கும் பித்ருக்களுக்கும் வலம் வந்து நமஸ்கரிக்கவும்.",
    "step.upasthanam.title": "உபஸ்தானம்",
    "step.upasthanam.how": "பித்ருக்களுக்கு மீண்டும் வணக்கம் செலுத்தவும்.",
    "step.abhivadaye.title": "அபிவாதயே",
    "step.abhivadaye.how": "உங்கள் கோத்ரம், ப்ரவரம் சொல்லி நமஸ்கரிக்கவும்.",
    "step.udvasanam.title": "உத்வாஸனம்",
    "step.udvasanam.how": "ஆவாஹனம் செய்த பித்ருக்களைத் தங்கள் இடத்திற்குத் திரும்ப வேண்டி, ஒவ்வொரு கூர்ச்சத்தையும் அவிழ்க்கவும்.",
    "step.sarva_tarpanam.title": "ஸர்வ தர்ப்பணம்",
    "step.sarva_tarpanam.how": "எல்லா கூர்ச்சங்களையும் மீதமுள்ள எள்ளையும் பிடித்து, அனைவருக்குமாக ஒரு முறை நீர் விடவும்.",
    "step.pavitram_visarjanam.title": "பவித்ர விஸர்ஜனம்",
    "step.pavitram_visarjanam.how": "பவித்ரத்தை அவிழ்த்து, காதில் வைக்கவும் அல்லது வடமேற்கில் போடவும்.",
    "step.achamanam_2.title": "ஆசமனம்",
    "step.achamanam_2.how": "முதல் படியில் செய்தது போல ஆசமனம் செய்யவும்.",
    "step.samarpanam.title": "ஸமர்ப்பணம்",
    "step.samarpanam.how": "உடல், வாக்கு, மனத்தால் செய்த கர்மாவை அர்ப்பணிக்கவும்.",
    "step.dakshina.title": "தக்ஷிணை",
    "step.dakshina.how": "விருப்பம்: நடத்திய ஆசார்யருக்கு தக்ஷிணை அளிக்கவும்.",
    "step.after_notes.title": "தர்ப்பணத்திற்குப் பின்",
    "step.after_notes.how": "ப்ரம்ம யஜ்ஞமும் நித்ய பூஜையும் தொடரலாம். இந்நாளில் இரவு எளிய உணவு வழக்கம்.",

    "chip.facing.east": "கிழக்கு நோக்கி",
    "chip.facing.south": "தெற்கு நோக்கி",
    "chip.theertham.brahma": "ப்ரம்ம தீர்த்தம் (உள்ளங்கை அடியிலிருந்து அருந்துதல்)",
    "chip.theertham.pitru": "பித்ரு தீர்த்தம் (கட்டை விரல் – ஆள்காட்டி விரல் இடையே விடுதல்)",
    "chip.pavitram": "பவித்ரம் அணிந்து",
    "step.do_title": "செய்ய வேண்டியது",
    "step.mantra_title": "சொல்ல வேண்டியது",
    "step.materials.do": "முதலில் ஸ்நானம் செய்து பஞ்சகச்சம், அங்கவஸ்திரம் அணியவும். தர்ப்பணம் முடியும் வரை உண்ண வேண்டாம்.\nபவித்ரம் (2–3 தர்ப்பைகளால் ஆன மோதிரம்), கூர்ச்சங்கள் (நுனி வளையமாக முடிச்சிட்ட தர்ப்பை) முன்பே செய்து வைக்கவும்.\nதாழ்ந்த ஆஸனத்தில் அமர்ந்து, முன்னால் தட்டு; வலப்பக்கம் நீர் சொம்பும் எள் கிண்ணமும் வைக்கவும்.\nஆசமனத்திற்கு பஞ்சபாத்ரத்தில் நீரும் உத்தரணியும் வைக்கவும்.",
    "step.achamanam_1.do": "கிழக்கு நோக்கி அமரவும்; பூணூல் வழக்கம் போல் (இடது தோள்).\nவலது உள்ளங்கையை பசுவின் காது போல் (கோகர்ணம்) குழித்துக் கொள்ளவும்: ஆள்காட்டி விரல் மடங்கி, கட்டை விரலும் சுண்டு விரலும் விலகி.\nதொண்டை நனையும் அளவு மட்டும் உத்தரணியால் நீர் எடுத்து, உள்ளங்கை அடியிலிருந்து மூன்று முறை அருந்தவும் — அச்யுதாய, அனந்தாய, கோவிந்தாய நம:.\nகேஶவ, நாராயண: வலது கட்டை விரலால் வலது கன்னம், பின் இடது கன்னம்.\nமாதவ, கோவிந்த: மோதிர விரலால் வலது கண், பின் இடது கண்.\nவிஷ்ணு, மதுஸூதன: ஆள்காட்டி விரலால் வலது நாசி, பின் இடது நாசி.\nத்ரிவிக்ரம, வாமன: சுண்டு விரலால் வலது காது, பின் இடது காது.\nஶ்ரீதர, ஹ்ருஷீகேஶ: நடு விரலால் வலது தோள், பின் இடது தோள்.\nபத்மநாப: எல்லா விரல்களாலும் தொப்புள். தாமோதர: எல்லா விரல்களாலும் உச்சந்தலை.",
    "step.pavitram_dharanam.do": "கைகளைக் கழுவவும்.\nமந்திரம் சொல்லி வலது மோதிர விரலில் பவித்ரம் போட்டுக் கொள்ளவும்.\nகட்டை தர்ப்பைகளை காலுக்கு அடியில் போட்டுக் கொள்ளவும்.\nகையை ஜலம் தொட்டு அலம்பி, சில கட்டை தர்ப்பைகளை பவித்ரத்துடன் மடித்து வைத்துக் கொள்ளவும்.",
    "step.ganapati_dhyanam.do": "இரு கைகளையும் தளர்வாக முஷ்டியாக்கவும்.\nசொல்லும் போது விரல் முட்டிகளால் நெற்றிப் பொட்டுகளில் மெதுவாக (சுமார் ஐந்து முறை) குட்டிக் கொள்ளவும்.\nபின் கைகூப்பி நமஸ்கரிக்கவும்.",
    "step.pranayamam.do": "நேராக அமர்ந்து இடது கையை மடியில் வைக்கவும்.\nவலது கை: ஆள்காட்டி, நடு விரல்களை உள்ளங்கையில் மடக்கவும். கட்டை விரல் வலது நாசியை மூடும்; மோதிர, சுண்டு விரல்கள் இடது நாசியை மூடும்.\nஇடது நாசி வழியாக மூச்சை உள்ளிழுக்கவும் (கட்டை விரல் வலதை மூடி).\nஇரு நாசிகளையும் மூடி, மூச்சைப் பிடித்தபடி மந்திரம் முழுவதையும் மெதுவாக / மனதில் சொல்லவும்.\nவலது நாசி வழியாக மெதுவாக வெளியே விடவும் (மோதிர, சுண்டு விரல்கள் இடதை மூடி).\nமுடிவில் வலது விரல்களால் வலது காதைத் தொடவும். பல குடும்பங்களில் இது மூன்று முறை.",
    "step.sankalpam_deva_part.do": "வலது உள்ளங்கையை இடது உள்ளங்கை மேல் வைத்து, தர்ப்பையுடன் வலது தொடையின் மேல் வைக்கவும்.\nகாலம், இடத்தைத் தெளிவாகச் சொல்லவும். கைகளை அப்படியே வைத்திருக்கவும்; ஸங்கல்பம் அடுத்த படியில் தொடர்கிறது.",
    "step.sankalpam_pitru_part.do": "பூணூலை வலது தோளுக்கு மாற்றவும் (ப்ராசீனாவீதி).\nமுன்பு போலவே உள்ளங்கைகளை வலது தொடை மேல் வைத்திருக்கவும்.\nகோத்ரங்களையும் பெயர்களையும் மெதுவாகச் சொல்லவும் — இது சரியாக இருக்க வேண்டிய பகுதி.\n“கரிஷ்யே” என்னும் போது, குடும்ப வழக்கப்படி நீரைத் தொடவும் (அல்லது எள்ளுடன் சிறிது நீரைத் தட்டில் விடவும்).",
    "step.darbha_nirasanam.do": "பவித்ரத்துடன் இருக்கும் கட்டை தர்ப்பங்களை மட்டும் கீழே போடவும் (பவித்ரம் அணிந்தபடியே).\nபூணூலை வலம் போட்டுக் கொண்டு, கையில் ஜலத்தால் துடைத்துக் கொள்ளவும்.\nபின் பூணூலை இடம் போட்டுக் கொள்ளவும்.",
    "step.koorcha_sthapanam.do": "பூணூலை வலது தோளுக்கு மாற்றவும்.\nதாம்பாளத்தின் நடுவில் கூர்ச்சத்தை நுனி தெற்காக வைக்கவும்.\nஆவாஹன மந்திரம் சொல்லி, கையை மறித்து, ஒவ்வொரு கூர்ச்சத்தின் நுனியிலும் எள் போடவும்.",
    "step.avahanam_pitru.do": "வலது கையின் கட்டை, நடு, மோதிர விரல்களால் ஒரு சிட்டிகை எள் எடுக்கவும்.\nமுதல் கூர்ச்சத்தைப் பார்த்து, ஒவ்வொரு பெயர் சொல்லும் போதும் அவரை நினைத்து மந்திரம் சொல்லவும்.\n“ஆவாஹயாமி” என்னும் போது எள்ளை முதல் கூர்ச்சத்தில் வைக்கவும்.",
    "step.avahanam_matamaha.do": "புதிதாக ஒரு சிட்டிகை எள் எடுக்கவும்.\nஇரண்டாம் கூர்ச்சத்தை (தாய் வழி) பார்த்துச் சொல்லவும்.\n“ஆவாஹயாமி” என்னும் போது எள்ளை அதில் வைக்கவும்.",
    "step.avahanam_karunya.do": "புதிதாக ஒரு சிட்டிகை எள் எடுக்கவும்.\nகாருண்ய கூர்ச்சத்தைப் பார்த்துச் சொல்லவும்.\n“ஆவாஹயாமி” என்னும் போது எள்ளை அதில் வைக்கவும்.",
    "step.asanam.do": "மந்திரம் சொல்லி, ஆவாஹனம் செய்த பித்ருக்களுக்கு ஆஸனமாக ஒவ்வொரு கூர்ச்சத்தின் மேலும் சில தர்ப்பைகளை வைக்கவும்.",
    "step.aradhanam.do": "சொல்லும் போது எல்லா கூர்ச்சங்களின் மேலும் எள் தூவவும்.\nமுழு ஶ்ராத்தத்தின் எல்லா உபசாரங்களுக்கும் (புஷ்பம், சந்தனம் முதலியவை) இது பதில்.",
    "step.tarpanam_pitru.do": "இடது கையில் சொம்பு. வலது உள்ளங்கையில் ஒரு சிட்டிகை எள்.\nநீர் கட்டை விரல் – ஆள்காட்டி விரல் இடையே வழியும்படி வலது கையைச் சாய்க்கவும் (பித்ரு தீர்த்தம்).\nஒரு வரி சொல்லவும். “தர்ப்பயாமி” என்னும் போது எள்ளுடன் நீரை முதல் கூர்ச்சத்தில் விடவும்.\nஒவ்வொரு வரியையும் காட்டிய எண்ணிக்கை முறை சொல்லவும் (எண்ணியைத் தட்டவும்). உள்ளங்கையில் எள் தீர்ந்தால் மீண்டும் எடுக்கவும்.",
    "step.tarpanam_matamaha.do": "பித்ரு வர்க்கம் போலவே: இடது கையில் சொம்பு, வலது உள்ளங்கையில் எள்.\nஒவ்வொரு “தர்ப்பயாமி”க்கும் பித்ரு தீர்த்தமாக இரண்டாம் கூர்ச்சத்தில் விடவும்.\nஒவ்வொரு வரியையும் காட்டிய எண்ணிக்கை முறை சொல்லவும்.",
    "step.tarpanam_karunya.do": "அதே முறை: வலது உள்ளங்கையில் எள், கட்டை – ஆள்காட்டி விரல் இடையே நீர்.\nகாட்டிய ஒவ்வொரு முறைக்கும் காருண்ய கூர்ச்சத்தில் விடவும்.",
    "step.pradakshina_namaskaram.do": "பூணூலை வழக்கமான நிலைக்கு மாற்றவும்.\nசொல்லியபடி நின்ற இடத்திலேயே வலமாக மூன்று முறை சுற்றவும்.\nபின் நமஸ்கரிக்கவும்.",
    "step.upasthanam.do": "பூணூலை வலது தோளுக்கு மாற்றவும்.\nகூர்ச்சங்களை நோக்கி நின்று கைகூப்பிச் சொல்லவும்.",
    "step.abhivadaye.do": "பூணூலை வழக்கமான நிலைக்கு மாற்றவும்.\nநிற்கவும். வலது கையால் வலது காதையும் இடது கையால் இடது காதையும் தொடவும்.\nஅபிவாதயேயைத் தெளிவாகச் சொல்லவும்.\nபின் நமஸ்கரிக்கவும்.",
    "step.udvasanam.do": "பூணூலை வலது தோளுக்கு மாற்றவும்.\nகூர்ச்சத்தைப் பார்த்து யதாஸ்தான வரியைச் சொல்லவும்.",
    "step.sarva_tarpanam.do": "தாம்பாளத்தில் உள்ள கூர்ச்சத்தை எடுத்துப் பிரிக்கவும்.\nவலது கை கட்டைவிரல் – ஆள்காட்டி விரலுக்கு நடுவில் வைத்துக் கொள்ளவும்.\nமந்திரம் சொல்லி ஜலம் விடவும்.",
    "step.pavitram_visarjanam.do": "பூணூலை வழக்கமான நிலைக்கு மாற்றவும்.\nபவித்ரத்தை அவிழ்க்கவும் (விரலிலிருந்து இழுக்க வேண்டாம்).\nவலது காதில் வைக்கவும் அல்லது வடமேற்கில் போடவும்.",
    "step.achamanam_2.do": "தொடக்கத்தில் செய்தது போலவே ஆசமனம்: அச்யுதாய, அனந்தாய, கோவிந்தாய நம: என மூன்று முறை அருந்தி, கேஶவாதி ஸ்பர்ஶங்கள்.",
    "step.samarpanam.do": "வலது உள்ளங்கையில் சிறிது நீர் எடுக்கவும்.\nசொல்லி முடித்து, கர்மா முழுவதையும் பகவானுக்கு அர்ப்பணித்து நீரைத் தட்டில் விடவும்.",
    "step.dakshina.do": "ஆசார்யர் நடத்தியிருந்தால், வெற்றிலை, பழம், தக்ஷிணையை துளசியுடன் அளித்து நமஸ்கரிக்கவும்.",
    "step.after_notes.do": "தட்டிலுள்ள நீரை மரம் அல்லது செடியின் அடியில் ஊற்றவும்; சாக்கடையில் அல்ல.\nப்ரம்ம யஜ்ஞமும் நித்ய பூஜையும் தொடரலாம்.\nதர்ப்பணம் முடிந்த பின் மட்டுமே உண்ணவும். இரவு கர்த்தாவும் மனைவியும் பொதுவாக எளிய உணவு (டிபன், பழம் அல்லது பால்) உண்பர்.",
    "preset.tamilSheet": "தமிழ் வாத்யார் குறிப்பு (பெண்கள் பெயர் இல்லை)",

    "step.hiranya_visvedeva.how": "விஶ்வேதேவர்களுக்காக (ஶ்ராத்த போஜனத்திற்குப் பதில்) தக்ஷிணை அளித்தல்.",

    "step.hiranya_pitru.do": "பூணூலை வலது தோளுக்கு மாற்றவும்.\nதுளசியுடன் தக்ஷிணையைப் பிடித்துச் சொல்லி, “ஸம்ப்ரததே” என்னும் போது அளிக்கவும்.",

/* ---- js/store.js ---- */
/* js/store.js — tiny pub/sub state store + localStorage persistence + JSON export/import
   (spec §7.1). All localStorage access is wrapped in try/catch so the app still works when
   storage throws (private browsing, quota, file:// restrictions, etc). */
window.Thar = window.Thar || {};
(function (T) {
  T.store = T.store || {};

  var STORAGE_KEY = "thar.profile.v1";
  var UI_KEY = "thar.ui.v1";
  var OVERRIDES_KEY = "thar.overrides.v1";

  var listeners = [];
  var state = {
    profile: null,
    ui: { lang: "en", script: "iast", theme: "auto", occasion: "amavasya", date: null, panchang: {} },
    overrides: {} // { "occasion|stepId|lineId": "edited text" }
  };

  function safe(fn, fallback) {
    try { return fn(); } catch (e) { return fallback; }
  }

  T.store.get = function () { return state; };

  T.store.subscribe = function (fn) {
    listeners.push(fn);
    return function unsubscribe() {
      listeners = listeners.filter(function (l) { return l !== fn; });
    };
  };

  function notify() {
    listeners.forEach(function (fn) { safe(function () { fn(state); }); });
  }

  T.store.setProfile = function (profile) {
    state.profile = profile;
    T.store.persist();
    notify();
  };

  T.store.updateProfile = function (mutator) {
    if (!state.profile) return;
    mutator(state.profile);
    T.store.persist();
    notify();
  };

  // Save without re-rendering — used while typing so focus/caret are not lost.
  T.store.updateProfileQuiet = function (mutator) {
    if (!state.profile) return;
    mutator(state.profile);
    T.store.persist();
  };

  T.store.clearAll = function () {
    safe(function () {
      [STORAGE_KEY, UI_KEY, OVERRIDES_KEY].forEach(function (k) { window.localStorage.removeItem(k); });
    });
    state.profile = JSON.parse(JSON.stringify(T.data.emptyProfile));
    state.ui = Object.assign({}, state.ui, { occasion: "amavasya", panchang: {} });
    state.overrides = {};
    T.store.persist();
    notify();
  };

  T.store.setUI = function (patch) {
    Object.keys(patch).forEach(function (k) { state.ui[k] = patch[k]; });
    T.store.persist();
    notify();
  };

  T.store.setOverride = function (occasion, stepId, lineId, text) {
    var key = occasion + "|" + stepId + "|" + lineId;
    state.overrides[key] = text;
    T.store.persist();
    notify();
  };

  T.store.getOverride = function (occasion, stepId, lineId) {
    return state.overrides[occasion + "|" + stepId + "|" + lineId];
  };

  T.store.resetOverride = function (occasion, stepId, lineId) {
    delete state.overrides[occasion + "|" + stepId + "|" + lineId];
    T.store.persist();
    notify();
  };

  T.store.resetAllOverrides = function () {
    state.overrides = {};
    T.store.persist();
    notify();
  };

  T.store.persist = function () {
    safe(function () {
      if (state.profile) window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state.profile));
      window.localStorage.setItem(UI_KEY, JSON.stringify(state.ui));
      window.localStorage.setItem(OVERRIDES_KEY, JSON.stringify(state.overrides));
    });
  };

  T.store.load = function () {
    var profile = safe(function () {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }, null);
    var ui = safe(function () {
      var raw = window.localStorage.getItem(UI_KEY);
      return raw ? JSON.parse(raw) : null;
    }, null);
    var overrides = safe(function () {
      var raw = window.localStorage.getItem(OVERRIDES_KEY);
      return raw ? JSON.parse(raw) : null;
    }, null);
    if (profile) state.profile = profile;
    if (ui) state.ui = Object.assign(state.ui, ui);
    if (overrides) state.overrides = overrides;
    return state;
  };

  // ---- Export / import (profile JSON) ----
  T.store.exportProfileJSON = function () {
    return JSON.stringify(state.profile, null, 2);
  };

  T.store.importProfileJSON = function (jsonText) {
    var parsed = JSON.parse(jsonText); // let the caller catch a parse error
    state.profile = parsed;
    T.store.persist();
    notify();
    return parsed;
  };

  T.store.downloadProfile = function (filename) {
    var blob = new Blob([T.store.exportProfileJSON()], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename || "tharpanam-profile.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  };
})(window.Thar);

/* ---- js/engine/rules.js ---- */
/* js/engine/rules.js — evaluates data/rules.js against a (profile, occasion) context.
   Pure, DOM-free, no eval(). Returns { blocks:[], warnings:[], flags:{} }. */
window.Thar = window.Thar || {};
(function (T) {
  T.engine = T.engine || {};

  function personAlive(profile, key) {
    if (key === "karunya") return null; // handled separately (list, not a single person)
    var p = profile.people && profile.people[key];
    return p ? !!p.alive : false;
  }

  // Only the slots that will actually be recited count (unused generations 4–5 don't).
  function anyPersonUnknown(profile) {
    var lineage = T.engine.resolveLineage(profile);
    return ["pitru", "matamaha"].some(function (v) {
      if (!lineage[v]) return false;
      return lineage[v].male.slots.concat(lineage[v].female.slots).some(function (s) { return !s.nameKnown; });
    });
  }

  function occasionMatches(cond, occasion) {
    if (!cond) return true;
    if (Array.isArray(cond)) return cond.indexOf(occasion) !== -1;
    return cond === occasion;
  }

  // Evaluate one condition node against context {profile, occasion}.
  function evalCond(cond, ctx) {
    if (cond.all) return cond.all.every(function (c) { return evalCond(c, ctx); });
    if (cond.any) return cond.any.some(function (c) { return evalCond(c, ctx); });

  var CHAIN_ROWS = {
    pitru: [["pitru_male", "profile.lineage.male_line"], ["pitru_female", "profile.lineage.female_line"]],
    matamaha: [["matamaha_male", "profile.lineage.male_line"], ["matamaha_female", "profile.lineage.female_line"]]
  };

  // Which "older generations" disclosures the user opened by hand (survives re-renders).
  var openedByUser = {};

  function gotraSelectHtml(attr, selected, forceOther) {
    var isOther = forceOther || (!!selected && GOTRA_OPTIONS.indexOf(selected) === -1);
    return '<select ' + attr + '><option value="">—</option>' +
      GOTRA_OPTIONS.map(function (g) {
        return '<option value="' + T.ui.esc(g) + '"' + (g === selected ? " selected" : "") + ">" + T.ui.esc(GOTRA_LABELS[g] || g) + "</option>";
      }).join("") +
      '<option value="' + OTHER + '"' + (isOther ? " selected" : "") + ">" + T.ui.t("profile.gotra.other") + "</option></select>";
  }
  function selectOptionsHtml(pairs, selected) {
    return pairs.map(function (p) {
      return '<option value="' + p[0] + '"' + (p[0] === selected ? " selected" : "") + ">" + T.ui.esc(p[1]) + "</option>";
    }).join("");
  }

  function slotBadge(slot) {
    if (slot === "living") return '<span class="slot-badge living">' + T.ui.t("profile.person.skipped") + "</span>";
    if (slot === "unused") return '<span class="slot-badge unused">' + T.ui.t("profile.person.not_needed") + "</span>";
    if (slot === "omitted") return '<span class="slot-badge unused">' + T.ui.t("profile.person.omitted") + "</span>";
    return '<span class="slot-badge used">' + T.ui.t("roopa." + slot) + "</span>";
  }

  function personCard(profile, key, chain) {
    var p = (profile.people || {})[key] || { alive: false, name: "" };
    var label = T.ui.t(T.engine.PERSON_META[key].labelKey);
    var slot = chain.slotOf[key];
    var cls = slot === "living" ? " skipped" : (slot === "unused" || slot === "omitted" ? " unused" : "");
    var gen = T.engine.PERSON_META[key].generation;
    var movedUp = slot !== "living" && slot !== "unused" && chain.shifted &&
      ["Vasu", "Rudra", "Aditya"].indexOf(slot) !== gen - 1;
    return (
      '<div class="person-card' + cls + '" data-person="' + key + '">' +
      '<div class="rel-name">' + T.ui.esc(label) + "</div>" +
      slotBadge(slot) +
      (movedUp ? '<div class="shift-note">↑ ' + T.ui.t("profile.person.moved_up", { slot: T.ui.t("roopa." + slot) }) + "</div>" : "") +
      '<div class="field"><input type="text" data-field="name" aria-label="' + T.ui.esc(label) + '" placeholder="' +
      T.ui.esc(T.ui.t("profile.person.name_placeholder")) + '" value="' + T.ui.esc(p.name || "") + '"' + (slot === "living" ? " disabled" : "") + "></div>" +
      '<label class="check"><input type="checkbox" data-field="alive"' + (p.alive ? " checked" : "") + "> " + T.ui.t("profile.person.alive") + "</label>" +
      '<label class="check"><input type="checkbox" data-field="unknownName"' + (p.unknownName ? " checked" : "") + (slot === "living" ? " disabled" : "") + "> " + T.ui.t("profile.person.unknown_name") + "</label>" +
      '<label class="check"><input type="checkbox" data-field="omit"' + (p.omit ? " checked" : "") + (slot === "living" ? " disabled" : "") + "> " + T.ui.t("profile.person.omit") + "</label>" +
      "</div>"
    );
  }

  function chainRow(profile, chainKey, titleKey, chain) {
    var keys = T.engine.CHAINS[chainKey];
    var visible = keys.slice(0, T.engine.SLOT_COUNT);
    var older = keys.slice(T.engine.SLOT_COUNT);
    var olderHasData = older.some(function (k) { var p = (profile.people || {})[k]; return p && (p.name || p.alive); });
    var open = chain.needsOlder || olderHasData || openedByUser[chainKey];
    return (
      '<div class="chain-row"><h4>' + T.ui.t(titleKey) + "</h4>" +
      '<div class="lineage-grid">' + visible.map(function (k) { return personCard(profile, k, chain); }).join("") + "</div>" +
      '<details class="older-gens" data-chain="' + chainKey + '"' + (open ? " open" : "") + ">" +
      "<summary>" + T.ui.t(chain.needsOlder ? "profile.lineage.older_needed" : "profile.lineage.show_older") + "</summary>" +
      '<div class="lineage-grid">' + older.map(function (k) { return personCard(profile, k, chain); }).join("") + "</div>" +
      "</details>" +
      (chain.short ? '<p class="warn-note">' + T.ui.t("profile.lineage.short") + "</p>" : "") +
      "</div>"
    );
  }

  // The mother's side is said with her birth gotra (her father's gotra): one field for the whole
  // side, stored as people.mother.birthGotra. Also used for karunya relatives on her side.
  function matamahaGotraField(profile) {
    var m = (profile.people || {}).mother || {};
    var g = m.birthGotra || "";
    var isOther = m._gotraOther || (!!g && GOTRA_OPTIONS.indexOf(g) === -1);
    return '<div class="field matamaha-gotra"><label>' + T.ui.t("profile.lineage.matamaha_gotra") + "</label>" +
      gotraSelectHtml('data-mgotra="select"', g, m._gotraOther) +
      (isOther ? '<input type="text" data-mgotra="text" placeholder="' + T.ui.esc(T.ui.t("profile.gotra.other_placeholder")) + '" value="' +
        T.ui.esc(GOTRA_OPTIONS.indexOf(g) === -1 ? g : "") + '">' : "") +
      '<p class="hint">' + T.ui.t(g ? "profile.lineage.matamaha_gotra_hint" : "profile.lineage.matamaha_gotra_empty") + "</p></div>";
  }

  function vargaSection(profile, varga, lineage) {
    var titleKey = varga === "pitru" ? "profile.lineage.pitru_varga" : "profile.lineage.matamaha_varga";
    var data = lineage[varga];
    var skip = ((profile.settings || {}).skipJnatajnata || {})[varga];
    return "<h3>" + T.ui.t(titleKey) + "</h3>" +
      (varga === "matamaha" ? matamahaGotraField(profile) : "") +
      (varga === "matamaha" ? '<div class="btn-row" style="margin-bottom:8px;">' +
        '<button type="button" class="btn secondary small" data-only="mgm">' + T.ui.t("profile.lineage.only_mgm") + "</button>" +
        '<button type="button" class="btn secondary small" data-only="">' + T.ui.t("profile.lineage.say_all") + "</button></div>" : "") +
      '<label class="check"><input type="checkbox" data-jnata="' + varga + '"' + (skip ? "" : " checked") + "> " + T.ui.t("profile.lineage.jnatajnata") + "</label>" +
      CHAIN_ROWS[varga].map(function (row) {
        var gender = row[0].split("_")[1];
        return chainRow(profile, row[0], row[1], data[gender]);
      }).join("");
  }

  // Resolve the matamaha chains even in paternal-only mode, so the collapsed data still validates.
  function lineageForForm(profile) {
    var both = JSON.parse(JSON.stringify(profile));
    both.settings = Object.assign({}, both.settings, { vargaMode: "both" });
    return T.engine.resolveLineage(both);
  }

  function pravaraEditor(k) {
    var rishis = T.engine.resolvePravara(k) || [];
    var options = T.data.pravaraOptions(k.gotra);
    var custom = !!(k.pravaraOverride && k.pravaraOverride.length);
    var n = rishis.length;
    return (
      '<div class="field pravara-editor"><label>' + T.ui.t("profile.pravara.title") + "</label>" +
      '<div class="seg" role="radiogroup" aria-label="' + T.ui.esc(T.ui.t("profile.pravara.count")) + '">' + [1, 3, 5, 7].map(function (c) {
        var sel = n === c;
        var fromGotra = options.some(function (o) { return o.length === c; });
        return '<button type="button" class="seg-btn' + (sel ? " active" : "") + '" data-rishi-count="' + c + '" aria-pressed="' + sel + '">' +
          T.ui.t(c === 1 ? "profile.pravara.count_one" : "profile.pravara.count_n", { n: c }) + (fromGotra ? " ✓" : "") + "</button>";
      }).join("") + "</div>" +
      '<ol class="rishi-list">' + rishis.map(function (r, i) {
        return '<li><input type="text" data-rishi="' + i + '" value="' + T.ui.esc(r) + '" aria-label="' + T.ui.esc(T.ui.t("profile.pravara.rishi", { n: i + 1 })) + '">' +
          '<button type="button" class="icon-btn small" data-remove-rishi="' + i + '" aria-label="' + T.ui.esc(T.ui.t("action.remove")) + '">✕</button></li>';
      }).join("") + "</ol>" +
      '<div class="pravara-actions">' +
      '<button type="button" class="btn secondary small" id="btn-add-rishi">+ ' + T.ui.t("profile.pravara.add") + "</button>" +
      (custom ? ' <button type="button" class="btn secondary small" id="btn-reset-pravara">' + T.ui.t("profile.pravara.reset") + "</button>" : "") +
      "</div>" +
      '<p class="hint">' + (n ? T.ui.t("profile.pravara.summary", { n: n, word: T.data.countWord(n) }) : T.ui.t("profile.pravara.none")) +
      (custom ? " · " + T.ui.t("profile.pravara.custom") : "") + "</p>" +
      (n && !T.data.isUsualPravaraCount(n) ? '<p class="warn-note">' + T.ui.t("profile.pravara.unusual") + "</p>" : "") +
      (rishis.some(function (r) { return !r; }) ? '<p class="warn-note">' + T.ui.t("profile.pravara.blank") + "</p>" : "") +
      "</div>"
    );
  }

  var FEM_SUFFIXES = ["nāmnī", "dā", "ammadā", "devī"];
  var MASC_SUFFIXES = ["śarma", "varma", "gupta"];
  var LEGACY_FEM = { "nāmnīḥ": "nāmnī", "dāḥ": "dā" };

  function segHtml(attr, current, options, labelPrefix) {
    return '<div class="seg" role="radiogroup">' + options.map(function (k) {
      var sel = current === k;
      return '<button type="button" class="seg-btn' + (sel ? " active" : "") + '" ' + attr + '="' + k + '" aria-pressed="' + sel + '">' +
        T.ui.t(labelPrefix + k) + "</button>";
    }).join("") + "</div>";
  }

  // Suffix picker: known stems plus "custom" with a text box.
  function suffixField(key, current, options, labelKey) {
    var isCustom = !!current && options.indexOf(current) === -1;
    return '<div class="field"><label>' + T.ui.t(labelKey) + '</label><select data-suffix="' + key + '">' +
      options.map(function (o) { return '<option value="' + o + '"' + (o === current ? " selected" : "") + ">" + o + "</option>"; }).join("") +
      '<option value="__custom"' + (isCustom ? " selected" : "") + ">" + T.ui.t("profile.wording.custom") + "</option></select>" +
      (isCustom ? '<input type="text" data-suffix-text="' + key + '" value="' + T.ui.esc(current) + '">' : "") + "</div>";
  }

  // Live preview of the generated pitru sankalpam and first tharpanam lines.
  function wordingPreview() {
    var built;
    try { built = T.ui.getProcedureResult().result; } catch (e) { return ""; }
    if (!built || built.blocked) return '<p class="hint">' + T.ui.t("recital.blocked") + "</p>";
    function step(id) { return built.steps.filter(function (s) { return s.id === id; })[0]; }
    var out = [];
    var sk = step("sankalpam_pitru_part");
    if (sk) out.push('<div class="say-label">' + T.ui.t("step.sankalpam_pitru_part.title") + '</div><div class="style-preview">' +
      T.ui.esc(T.ui.tr(sk.content.text)).replace(/\n/g, "<br>") + "</div>");
    var tp = step("tarpanam_pitru");
    if (tp) out.push('<div class="say-label">' + T.ui.t("step.tarpanam_pitru.title") + '</div><ol class="style-preview">' +
      tp.content.lines.slice(0, 6).map(function (l) { return "<li>" + T.ui.esc(T.ui.tr(l)) + "</li>"; }).join("") + "</ol>");
    var kp = step("tarpanam_karunya");
    if (kp && kp.content.lines.length > 1) out.push('<div class="say-label">' + T.ui.t("step.tarpanam_karunya.title") + '</div><ol class="style-preview">' +
      "<li>" + T.ui.esc(T.ui.tr(kp.content.lines[0])) + "</li></ol>");
    return out.join("");
  }

  // "Wording" card: how this family's vadhyar words the sankalpam and tharpanam lines.
  function wordingCard(profile) {
    var s = profile.settings || {};
    var style = s.tarpanaStyle || "booklet";
    var fem = LEGACY_FEM[s.feminineSuffix] || s.feminineSuffix || "nāmnī";
    return (
      '<div class="card"><h2>' + T.ui.t("profile.wording.title") + "</h2>" +
      '<p class="hint">' + T.ui.t("profile.wording.hint") + "</p>" +
      '<div class="field"><label>' + T.ui.t("profile.wording.presets") + '</label><div class="btn-row">' +
      T.data.wordingPresets.map(function (p) {
        return '<button type="button" class="btn secondary small" data-preset="' + p.key + '">' + T.ui.t(p.labelKey) + "</button>";
      }).join("") + "</div></div>" +

      '<h3>' + T.ui.t("profile.wording.sankalpam") + "</h3>" +
      '<div class="field">' + segHtml("data-seg-sankalpaStyle", s.sankalpaStyle === "full" ? "gotraFirst" : (s.sankalpaStyle || "gotraFirst"),
        ["gotraFirst", "gotraFirstUnnamed", "relationFirst"], "profile.wording.sankalpaStyle.") + "</div>" +
      '<label class="check"><input type="checkbox" data-check="matamahaSapatnika"' + (s.matamahaSapatnika !== false ? " checked" : "") + "> " +
      T.ui.t("profile.wording.sapatnika") + "</label>" +
      '<div class="field-row">' +
      '<div class="field"><label>' + T.ui.t("profile.settings.masaSystem") + '</label><select data-s="masaSystem">' +
      selectOptionsHtml([["solar", T.ui.t("profile.settings.masa.solar")], ["lunar", T.ui.t("profile.settings.masa.lunar")], ["both", T.ui.t("profile.settings.masa.both")]], s.masaSystem || "solar") + "</select></div>" +
      '<div class="field"><label>' + T.ui.t("profile.wording.yogaKarana") + '</label><select data-s="yogaKaranaStyle">' +
      selectOptionsHtml([["actual", T.ui.t("profile.wording.yk.actual")], ["vishnu", T.ui.t("profile.wording.yk.vishnu")], ["vishnuActual", T.ui.t("profile.wording.yk.vishnuActual")]], s.yogaKaranaStyle || "actual") + "</select></div>" +
      '<div class="field"><label>' + T.ui.t("profile.wording.changeStyle") + '</label><select data-s="changeStyle">' +
      selectOptionsHtml([["atTime", T.ui.t("profile.wording.change.atTime")], ["tadupari", T.ui.t("profile.wording.change.tadupari")]], s.changeStyle || "atTime") + "</select></div>" +
      "</div>" +

      '<h3>' + T.ui.t("profile.wording.names") + "</h3>" +
      '<div class="field-row">' +
      suffixField("masculineSuffix", s.masculineSuffix || "śarma", MASC_SUFFIXES, "profile.wording.masc") +
      suffixField("feminineSuffix", fem, FEM_SUFFIXES, "profile.settings.feminineSuffix") +
      "</div>" +
      '<label class="check"><input type="checkbox" id="omit-suffix"' + (s.omitNameSuffix ? " checked" : "") + "> " + T.ui.t("profile.style.omit_suffix") + "</label>" +

      '<h3>' + T.ui.t("profile.style.title") + "</h3>" +
      '<div class="field">' + segHtml("data-style", style, ["booklet", "asmat", "custom"], "profile.style.") + "</div>" +
      (style === "custom"
        ? '<div class="field"><label>' + T.ui.t("profile.style.custom_label") + '</label><textarea id="tarpana-custom" rows="2">' +
          T.ui.esc(s.tarpanaCustom || T.data.tarpanaStyles.asmat) + "</textarea>" +
          '<p class="hint">' + T.ui.t("profile.style.placeholders") + " " + T.data.tarpanaPlaceholders.map(function (k) { return "<code>{" + k + "}</code>"; }).join(" ") + "</p></div>"
        : '<p class="hint"><code>' + T.ui.esc(T.data.tarpanaStyles[style]) + "</code></p>") +
      '<div class="field"><label>' + T.ui.t("profile.wording.karunya") + '</label><select data-s="karunyaStyle">' +
      selectOptionsHtml([["singular", T.ui.t("profile.wording.karunya.singular")], ["same", T.ui.t("profile.wording.karunya.same")]], s.karunyaStyle || "singular") + "</select></div>" +
      '<div class="field"><label>' + T.ui.t("profile.wording.koorcham") + '</label><select data-s="koorchamMode">' +
      selectOptionsHtml([["separate", T.ui.t("profile.wording.koorcham.separate")], ["single", T.ui.t("profile.wording.koorcham.single")]], s.koorchamMode || "separate") + "</select></div>" +

      '<details class="do-block" open><summary>' + T.ui.t("profile.style.preview") + "</summary>" + wordingPreview() + "</details>" +
      "</div>"
    );
  }

  T.ui.renderProfile = function (container) {
    var profile = T.store.get().profile;
    var k = profile.kartha || {};
    var settings = profile.settings || {};
    var vargaMode = settings.vargaMode || "both";
    var lineage = lineageForForm(profile);
    var gotraIsOther = !!k.gotra && GOTRA_OPTIONS.indexOf(k.gotra) === -1;

    container.innerHTML =
      '<div class="card"><h2>' + T.ui.t("profile.kartha.title") + "</h2>" +
      '<div class="field-row">' +
      '<div class="field"><label>' + T.ui.t("profile.kartha.name") + '</label><input type="text" data-k="name" value="' + T.ui.esc(k.name || "") + '"></div>' +
      '<div class="field"><label>' + T.ui.t("profile.kartha.sharmaName") + '</label><input type="text" data-k="sharmaName" value="' + T.ui.esc(k.sharmaName || "") + '"></div>' +
      '<div class="field"><label>' + T.ui.t("profile.kartha.nameSuffix") + '</label><select data-k="nameSuffix">' + selectOptionsHtml([["śarmā", "śarmā"], ["varmā", "varmā"], ["guptā", "guptā"]], k.nameSuffix) + "</select></div>" +
      "</div>" +
      '<div class="field-row">' +
      '<div class="field"><label>' + T.ui.t("profile.kartha.gotra") + "</label>" + gotraSelectHtml('data-k="gotra"', k.gotra, k._gotraOther) +
      (gotraIsOther || k._gotraOther ? '<input type="text" data-k="gotraText" placeholder="' + T.ui.esc(T.ui.t("profile.gotra.other_placeholder")) + '" value="' + T.ui.esc(gotraIsOther ? k.gotra : "") + '">' : "") + "</div>" +
      '<div class="field"><label>' + T.ui.t("profile.kartha.sutra") + '</label><select data-k="sutra">' + selectOptionsHtml(SUTRA_OPTIONS, k.sutra) + "</select></div>" +
      '<div class="field"><label>' + T.ui.t("profile.kartha.shakha") + '</label><select data-k="shakha">' + selectOptionsHtml(SHAKHA_OPTIONS, k.shakha) + "</select></div>" +
      "</div>" +
      pravaraEditor(k) +
      "</div>" +

      '<div class="card"><h2>' + T.ui.t("profile.lineage.title") + "</h2>" +
      '<div class="field"><label>' + T.ui.t("profile.varga_mode.title") + '</label><div class="seg" role="radiogroup">' +
      ["both", "paternal"].map(function (m) {
        return '<button type="button" class="seg-btn' + (vargaMode === m ? " active" : "") + '" data-varga-mode="' + m + '" aria-pressed="' + (vargaMode === m) + '">' +
          T.ui.t("profile.varga_mode." + m) + "</button>";
      }).join("") + "</div>" +
      '<p class="hint">' + T.ui.t("profile.varga_mode.hint." + vargaMode) + "</p></div>" +
      vargaSection(profile, "pitru", lineage) +
      (vargaMode === "both" ? vargaSection(profile, "matamaha", lineage) :
        '<div class="collapsed-note"><p class="hint" style="margin-top:0;">' + T.ui.t("profile.varga_mode.collapsed") + "</p>" + matamahaGotraField(profile) + "</div>") +
      "</div>" +

      '<div class="card"><h2>' + T.ui.t("profile.settings.title") + "</h2>" +
      '<label class="check"><input type="checkbox" data-check="includeBrahmaYajnam"' + (settings.includeBrahmaYajnam ? " checked" : "") + "> " +
      T.ui.t("profile.settings.brahmaYajnam") + "</label>" +
      '<div class="field-row">' +
      '<div class="field"><label>' + T.ui.t("profile.settings.achamanam") + '</label><select data-s="achamanamStyle">' +
      selectOptionsHtml([["keshava24", T.ui.t("profile.settings.achamanam.keshava24")], ["achyuta", T.ui.t("profile.settings.achamanam.achyuta")]],
        T.engine.achamanamStyle(settings)) + "</select></div>" +
      '<div class="field"><label>' + T.ui.t("profile.settings.femaleOfferings") + '</label><select data-s="femaleOfferings">' +
      selectOptionsHtml([["1", "1"], ["3", "3"]], String(settings.femaleOfferings || 3)) + "</select></div>" +
      '<div class="field"><label>' + T.ui.t("profile.settings.unknownGotraMode") + '</label><select data-s="unknownGotraMode">' +
      selectOptionsHtml([["tat_tat", "tat tat"], ["kashyapa", "Kashyapa"]], settings.unknownGotraMode || "tat_tat") + "</select></div>" +
      "</div></div>" +

      wordingCard(profile) +

      '<div class="card no-print"><div class="btn-row">' +
      '<button class="btn" id="btn-load-sample">' + T.ui.t("action.load_sample") + "</button>" +
      '<button class="btn secondary" id="btn-export">' + T.ui.t("action.export") + "</button>" +
      '<label class="btn secondary">' + T.ui.t("action.import") + '<input type="file" id="input-import" accept="application/json" hidden></label>' +
      '<button class="btn danger" id="btn-clear">' + T.ui.t("action.clear_saved") + "</button>" +
      "</div><p class=\"hint\">" + T.ui.t("profile.autosave_hint") + "</p></div>";

    wire(container);
  };

  function wire(container) {
    function on(sel, evt, fn) { container.querySelectorAll(sel).forEach(function (el) { el.addEventListener(evt, function (e) { fn(el, e); }); }); }

    on("[data-k]", "change", function (el) {
      T.store.updateProfile(function (p) {
        var key = el.getAttribute("data-k");
        if (key === "gotra") {
          if (el.value === OTHER) { p.kartha._gotraOther = true; p.kartha.gotra = ""; }
          else { p.kartha._gotraOther = false; p.kartha.gotra = el.value; }
          // New gotra → its own default pravara (drops any custom list).
          p.kartha.pravaraVariant = 0;
          p.kartha.pravaraOverride = null;
        } else if (key === "gotraText") {
          p.kartha.gotra = el.value.trim();
          p.kartha._gotraOther = true;
        } else {
          p.kartha[key] = el.value;
        }
      });
    });
    // Save as the user types (no re-render, so the caret stays put); "change" re-renders.
    on('input[type="text"][data-k="name"], input[type="text"][data-k="sharmaName"]', "input", function (el) {
      T.store.updateProfileQuiet(function (p) { p.kartha[el.getAttribute("data-k")] = el.value; });
    });
    on('.person-card input[type="text"][data-field="name"]', "input", function (el) {
      var key = el.closest(".person-card").getAttribute("data-person");
      T.store.updateProfileQuiet(function (p) {
        p.people = p.people || {};
        p.people[key] = p.people[key] || {};
        p.people[key].name = el.value;
      });
    });

    on("[data-s]", "change", function (el) {
      T.store.updateProfile(function (p) {
        p.settings = p.settings || {};
        var key = el.getAttribute("data-s");
        p.settings[key] = key === "femaleOfferings" ? parseInt(el.value, 10) : el.value;
      });
      if (el.getAttribute("data-s") === "masaSystem") T.ui.recomputePanchang();
    });
    on("[data-preset]", "click", function (el) {
      var preset = T.data.wordingPresets.filter(function (p) { return p.key === el.getAttribute("data-preset"); })[0];
      if (!preset) return;
      T.store.updateProfile(function (p) { Object.assign(p.settings, preset.settings); });
      T.ui.recomputePanchang();
    });
    on("[data-seg-sankalpaStyle]", "click", function (el) {
      T.store.updateProfile(function (p) { p.settings.sankalpaStyle = el.getAttribute("data-seg-sankalpaStyle"); });
    });
    on("[data-check]", "change", function (el) {
      T.store.updateProfile(function (p) { p.settings[el.getAttribute("data-check")] = el.checked; });
    });
    on("[data-suffix]", "change", function (el) {
      var key = el.getAttribute("data-suffix");
      T.store.updateProfile(function (p) { p.settings[key] = el.value === "__custom" ? " " : el.value; });
    });
    on("[data-suffix-text]", "change", function (el) {
      var key = el.getAttribute("data-suffix-text");
      T.store.updateProfile(function (p) { p.settings[key] = el.value.trim() || " "; });
    });
    on("[data-style]", "click", function (el) {
      T.store.updateProfile(function (p) {
        p.settings.tarpanaStyle = el.getAttribute("data-style");
        if (p.settings.tarpanaStyle === "custom" && !p.settings.tarpanaCustom) p.settings.tarpanaCustom = T.data.tarpanaStyles.asmat;
      });
    });
    on("#tarpana-custom", "change", function (el) {
      T.store.updateProfile(function (p) { p.settings.tarpanaCustom = el.value.trim(); });
    });
    on("#omit-suffix", "change", function (el) {
      T.store.updateProfile(function (p) { p.settings.omitNameSuffix = el.checked; });
    });
    on("[data-only]", "click", function (el) {
      var keep = el.getAttribute("data-only");
      T.store.updateProfile(function (p) {
        p.people = p.people || {};
        T.engine.CHAINS.matamaha_male.concat(T.engine.CHAINS.matamaha_female).forEach(function (k) {
          p.people[k] = p.people[k] || { name: "", alive: false };
          p.people[k].omit = keep ? k !== keep : false;
        });
        p.settings.skipJnatajnata = Object.assign({}, p.settings.skipJnatajnata, { matamaha: !!keep });
      });
    });
    on("[data-jnata]", "change", function (el) {
      T.store.updateProfile(function (p) {
        p.settings.skipJnatajnata = Object.assign({}, p.settings.skipJnatajnata);
        p.settings.skipJnatajnata[el.getAttribute("data-jnata")] = !el.checked;
      });
    });
    on("[data-varga-mode]", "click", function (el) {
      T.store.updateProfile(function (p) {
        p.settings = p.settings || {};
        p.settings.vargaMode = el.getAttribute("data-varga-mode");
      });
    });

    // Pravara editor: editing any rishi turns the list into a custom override.
    function currentRishis(p) { return T.engine.resolvePravara(p.kartha) || []; }
    // Count switch: use the gotra's own list of that length if it has one; otherwise trim the
    // current list or add blank slots to fill in.
    on("[data-rishi-count]", "click", function (el) {
      var c = parseInt(el.getAttribute("data-rishi-count"), 10);
      T.store.updateProfile(function (p) {
        var options = T.data.pravaraOptions(p.kartha.gotra);
        var idx = options.findIndex(function (o) { return o.length === c; });
        if (idx !== -1) {
          p.kartha.pravaraVariant = idx;
          p.kartha.pravaraOverride = null;
          return;
        }
        var list = currentRishis(p).slice(0, c);
        while (list.length < c) list.push("");
        p.kartha.pravaraOverride = list;
      });
    });
    on("[data-rishi]", "change", function (el) {
      T.store.updateProfile(function (p) {
        var list = currentRishis(p);
        list[parseInt(el.getAttribute("data-rishi"), 10)] = el.value.trim();
